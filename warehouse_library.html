<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Library - NFA Inventory</title>
    <link rel="stylesheet" href="css/warehouse.css" />
</head>
<body>
    <iframe src="sidebar.html" style="width: 250px; height: 100vh; border: none; position: fixed; left: 0; top: 0;"></iframe>

   
    <div class="main-content">
        <div class="header">
            <div class="header-left">
                <h1>Warehouse Library</h1>
            </div>
            <div class="header-right">
                <div class="user-info">
                    <div class="user-greeting">Hi, nfa_admin</div>
                    <div class="user-role">User</div>
                </div>
                <div class="user-avatar">N</div>
            </div>
        </div>

        <div class="controls">
            <div class="sort-section">
                <label>Sort by:</label>
                <select class="sort-select" id="sortSelect">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="code-asc">Code (A-Z)</option>
                    <option value="code-desc">Code (Z-A)</option>
                </select>
            </div>
            <div class="button-group">
                <button class="btn btn-preview" id="previewBtn">
                    <span>👁</span>
                    <span>Preview</span>
                </button>
                <button class="btn btn-add" id="addWarehouseBtn">
                    <span>+</span>
                    <span>Add Warehouse</span>
                </button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>WAREHOUSE CODE</th>
                        <th>WAREHOUSE NAME</th>
                        <th>LOCATION</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="warehouseTableBody">
                    <tr>
                        <td colspan="4" style="text-align:center;">Loading warehouses...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">DATA ENTRY OF WAREHOUSE</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="warehouseForm">
                    <div class="form-group">
                        <label class="form-label">Warehouse Code:</label>
                        <input type="text" class="form-input" id="warehouseCode" placeholder="Enter Warehouse Code" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Warehouse Name:</label>
                        <input type="text" class="form-input" id="warehouseName" placeholder="Enter Warehouse Name" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Location:</label>
                        <input type="text" class="form-input" id="location" placeholder="Enter Location" required>
                    </div>

                    <button type="submit" class="btn-save">Save Warehouse</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script>
        // ===================== FIREBASE CONFIG =====================
        const firebaseConfig = {
            apiKey: "AIzaSyB_hLdWDYdBsZFmhTFpg4QIzdOiB9JxxIw",
            authDomain: "nfa-main.firebaseapp.com",
            databaseURL: "https://nfa-main-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nfa-main",
            storageBucket: "nfa-main.firebasestorage.app",
            messagingSenderId: "314192469082",
            appId: "1:314192469082:web:2f301895179a22dbe68c63"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        console.log("Firebase initialized:", firebase.apps.length > 0);

        // ===================== GLOBAL VARIABLES =====================
        let allWarehouses = [];
        let currentSortOrder = 'newest';

        // ===================== MODAL CONTROLS =====================
        const modalOverlay = document.getElementById('modalOverlay');
        const addWarehouseBtn = document.getElementById('addWarehouseBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const warehouseForm = document.getElementById('warehouseForm');

        // Open modal
        addWarehouseBtn.addEventListener('click', () => {
            warehouseForm.reset();
            warehouseForm.removeAttribute('data-edit-id');
            modalOverlay.classList.add('active');
        });

        // Close modal
        closeModalBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        // Close modal when clicking outside
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });

        // Close modal with ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                modalOverlay.classList.remove('active');
            }
        });

        // ===================== SAVE WAREHOUSE =====================
        warehouseForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const form = e.target;
            const editId = form.getAttribute('data-edit-id');

            const warehouseCode = document.getElementById('warehouseCode').value.trim();
            const warehouseName = document.getElementById('warehouseName').value.trim();
            const location = document.getElementById('location').value.trim();

            // Clear previous errors
            document.querySelectorAll('input').forEach(field => {
                field.style.border = '';
            });
            document.querySelectorAll('.field-error-message').forEach(msg => msg.remove());

            // Validate required fields
            let hasEmptyFields = false;
            const requiredFields = [
                { id: 'warehouseCode', label: 'Warehouse Code' },
                { id: 'warehouseName', label: 'Warehouse Name' },
                { id: 'location', label: 'Location' }
            ];

            requiredFields.forEach(field => {
                const element = document.getElementById(field.id);
                if (!element.value.trim()) {
                    element.style.border = '2px solid #ff6b6b';
                    hasEmptyFields = true;
                    
                    const errorMsg = document.createElement('div');
                    errorMsg.className = 'field-error-message';
                    errorMsg.textContent = 'This field is required';
                    element.parentElement.appendChild(errorMsg);
                }
            });

            if (hasEmptyFields) {
                const firstEmptyField = document.querySelector('[style*="border: 2px solid"]');
                if (firstEmptyField) {
                    firstEmptyField.focus();
                }
                return;
            }

            const warehouseData = { 
                warehouseCode, 
                warehouseName, 
                location, 
                timestamp: Date.now() 
            };

            if (editId) {
                // Update existing warehouse
                warehouseData.updatedAt = new Date().toISOString();
                database.ref('warehouses/' + editId).update(warehouseData)
                    .then(() => {
                        alert('Warehouse updated successfully!');
                        form.reset();
                        form.removeAttribute('data-edit-id');
                        modalOverlay.classList.remove('show');
                    })
                    .catch((error) => {
                        console.error('Error updating warehouse:', error);
                        alert('Error updating warehouse: ' + error.message);
                    });
            } else {
                // Create new warehouse
                warehouseData.createdAt = new Date().toISOString();
                database.ref('warehouses').push(warehouseData)
                    .then(() => {
                        alert('Warehouse added successfully!');
                        form.reset();
                        modalOverlay.classList.remove('show');
                    })
                    .catch((error) => {
                        console.error('Error adding warehouse:', error);
                        alert('Error adding warehouse: ' + error.message);
                    });
            }
        });

        // ===================== LOAD WAREHOUSES FROM FIREBASE =====================
        function loadWarehouses() {
            const tbody = document.getElementById('warehouseTableBody');
            const warehousesRef = database.ref('warehouses');

            warehousesRef.on('value', (snapshot) => {
                allWarehouses = [];

                if (!snapshot.exists()) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" style="text-align:center;">No warehouses found</td>
                        </tr>`;
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    const docId = childSnapshot.key;
                    
                    allWarehouses.push({
                        id: docId,
                        data: data
                    });
                });
                
                sortWarehouses(currentSortOrder);
            }, (error) => {
                console.error('Error loading warehouses:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align:center; color: red;">Error loading warehouses: ${error.message}</td>
                    </tr>`;
            });
        }

        // ===================== SORT WAREHOUSES =====================
        function sortWarehouses(order) {
            currentSortOrder = order;
            
            allWarehouses.sort((a, b) => {
                if (order === 'newest' || order === 'oldest') {
                    const dateA = a.data.timestamp || 0;
                    const dateB = b.data.timestamp || 0;
                    return order === 'newest' ? dateB - dateA : dateA - dateB;
                } else if (order === 'code-asc' || order === 'code-desc') {
                    const codeA = (a.data.warehouseCode || '').toLowerCase();
                    const codeB = (b.data.warehouseCode || '').toLowerCase();
                    return order === 'code-asc' ? codeA.localeCompare(codeB) : codeB.localeCompare(codeA);
                }
            });
            
            renderWarehouses();
        }

        // ===================== RENDER WAREHOUSES =====================
        function renderWarehouses() {
            const tbody = document.getElementById('warehouseTableBody');
            tbody.innerHTML = '';

            if (allWarehouses.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align:center;">No warehouses found</td>
                    </tr>`;
                return;
            }

            allWarehouses.forEach(item => {
                const d = item.data;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${d.warehouseCode || '-'}</td>
                    <td>${d.warehouseName || '-'}</td>
                    <td>${d.location || '-'}</td>

                    <td class="actions-cell">
                <button class="action-btn" data-id="${item.id}" title="More actions">⋮</button>
                <div class="dropdown-menu">
                    <button class="dropdown-item" data-action="edit" data-id="${item.id}">
                        <span>✏️</span> Edit
                    </button>
                    <button class="dropdown-item" data-action="delete" data-id="${item.id}">
                        <span>🗑️</span> Delete
                    </button>
                </div>
            </td>
                `;
                tbody.appendChild(tr);
            });

            attachDropdownListeners();
        }

        // ===================== DROPDOWN HANDLERS =====================
        function closeAllDropdowns() {
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                menu.classList.remove('show');
            });
        }

        function attachDropdownListeners() {
            document.querySelectorAll('.action-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    closeAllDropdowns();
                    const dropdown = btn.nextElementSibling;
                    dropdown.classList.toggle('show');
                });
            });

            document.querySelectorAll('.dropdown-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = item.dataset.id;
                    const action = item.dataset.action;
                    
                    closeAllDropdowns();
                    
                    if (action === 'edit') {
                        editWarehouse(id);
                    } else if (action === 'delete') {
                        if (confirm('Are you sure you want to delete this warehouse?')) {
                            deleteWarehouse(id);
                        }
                    }
                });
            });
        }

        // Close dropdowns when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.action-btn')) {
                closeAllDropdowns();
            }
        });

        // ===================== EDIT WAREHOUSE =====================
        function editWarehouse(id) {
            database.ref('warehouses/' + id).once('value')
                .then((snapshot) => {
                    if (!snapshot.exists()) {
                        alert('Warehouse not found!');
                        return;
                    }
                    
                    const data = snapshot.val();
                    
                    document.getElementById('warehouseCode').value = data.warehouseCode || '';
                    document.getElementById('warehouseName').value = data.warehouseName || '';
                    document.getElementById('location').value = data.location || '';
                    
                    warehouseForm.setAttribute('data-edit-id', id);
                    modalOverlay.classList.add('active');
                })
                .catch((error) => {
                    console.error('Error loading warehouse:', error);
                    alert('Error loading warehouse: ' + error.message);
                });
        }

        // ===================== DELETE WAREHOUSE =====================
        function deleteWarehouse(id) {
            database.ref('warehouses/' + id).remove()
                .then(() => {
                    alert('Warehouse deleted successfully!');
                })
                .catch((error) => {
                    console.error('Error deleting warehouse:', error);
                    alert('Error deleting warehouse: ' + error.message);
                });
        }

        // ===================== SORT SELECT HANDLER =====================
        document.getElementById('sortSelect').addEventListener('change', (e) => {
            sortWarehouses(e.target.value);
        });

          // Preview button - opens preview page in new window
        document.getElementById('previewBtn').addEventListener('click', () => {
            window.open('warehouse_preview.html');
        });

        // ===================== INIT =====================
        window.addEventListener('DOMContentLoaded', () => {
            console.log('Warehouse Library page loaded');
            loadWarehouses();
        });
    </script>
</body>
</html>

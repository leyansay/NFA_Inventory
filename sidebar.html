<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1d2e;
            color: white;
        }

        .sidebar {
            width: 250px;
            height: 100vh;
            background: white;
            padding: 2rem 0;
            position: fixed;
            left: 0;
            top: 0;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
        }

        .logo {
            padding: 0 1.5rem;
            margin-bottom: 3rem;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .logo-image {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .logo h1 {
            font-size: 1.5rem;
            color: #000000;
            font-weight: 700;
        }

        .logo p {
            font-size: 0.75rem;
            color: #545c80;
            margin-top: 0.25rem;
        }

        .menu {
            list-style: none;
        }

        .menu-item {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #000000;
            font-size: 0.95rem;
            text-decoration: none;
        }

        .menu-item:hover {
            background: rgba(69, 129, 250, 0.1);
            border-left: 3px solid #4b86fc;
            color: rgb(0, 0, 0);
        }

        .menu-item.active {
            background: rgba(91, 141, 238, 0.2);
            border-left: 3px solid #5b8dee;
            color: rgb(59, 85, 252);
            font-weight: 600;
        }

        .menu-icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .menu-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 1rem 1.5rem;
        }

        .menu-section-title {
            padding: 1rem 1.5rem 0.5rem;
            color: #6b7299;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dropdown-item {
            position: relative;
        }

        .dropdown-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .dropdown-arrow {
            transition: transform 0.3s ease;
            font-size: 0.8rem;
        }

        .dropdown-arrow.open {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: rgba(255, 255, 255, 0.2);
        }

        .dropdown-menu.open {
            max-height: 300px;
            overflow-y: auto;
        }

        /* Custom scrollbar styling */
        .dropdown-menu::-webkit-scrollbar {
            width: 6px;
        }

        .dropdown-menu::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        .dropdown-menu::-webkit-scrollbar-thumb {
            background: rgba(91, 141, 238, 0.5);
            border-radius: 3px;
        }

        .dropdown-menu::-webkit-scrollbar-thumb:hover {
            background: rgba(91, 141, 238, 0.7);
        }

        /* Firefox scrollbar styling */
        .dropdown-menu {
            scrollbar-width: thin;
            scrollbar-color: rgba(91, 141, 238, 0.5) rgba(0, 0, 0, 0.2);
        }

        .dropdown-menu-item {
            padding: 0.65rem 1.5rem 0.65rem 3.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #000000;
            font-size: 0.9rem;
            
        }
        .dropdown-menu-last{
            margin-bottom: 20px;
        }

        .dropdown-menu-item:hover {
            background: rgba(39, 109, 249, 0.15);
            color: rgb(0, 0, 0);
        }

        .dropdown-menu-item.active {
            background: rgba(89, 143, 250, 0.25);
            color: rgb(0, 0, 0);
            font-weight: 600;
            border-left: 3px solid #5b8dee;
        }
    </style>
</head>
<body>
    
    <nav class="sidebar">
        <div class="logo">
            <div class="logo-container">
                <img src="images/nfa.png" 
                     alt="NFA Logo" 
                     class="logo-image">
                <div>
                    <h1>NFA Inventory</h1>
                    <p>Management System</p>
                </div>
            </div>
        </div>

        <ul class="menu">
            <li class="menu-item" data-page="home">
                <span class="menu-icon">🏠</span>
                <span>Home</span>
            </li>
            <li class="menu-item" data-page="accountable">
                <span class="menu-icon">👥</span>
                <span>Accountable Officer</span>
            </li>
            <li class="menu-item" data-page="transaction">
                <span class="menu-icon">💳</span>
                <span>Transaction</span>
            </li>
            <li class="menu-item" data-page="inventory">
                <span class="menu-icon">📦</span>
                <span>Inventory</span>
            </li>
            <li class="menu-item" data-page="report">
                <span class="menu-icon">📋</span>
                <span>Report</span>
            </li>
            
            <li class="menu-item dropdown-item" onclick="toggleDropdown()">
                <div class="dropdown-toggle">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <span class="menu-icon">📚</span>
                        <span>Library</span>
                    </div>
                    <span class="dropdown-arrow" id="dropdownArrow">▼</span>
                </div>
            </li>
            <ul class="dropdown-menu" id="libraryDropdown">
                <li class="dropdown-menu-item" data-page="activity">Activity</li>
                <li class="dropdown-menu-item" data-page="cereal">Cereal</li>
                <li class="dropdown-menu-item" data-page="location">Location</li>
                <li class="dropdown-menu-item" data-page="sack">Sack</li>
                <li class="dropdown-menu-item" data-page="warehouse-lib">Warehouse</li>
                <li class="dropdown-menu-item" data-page="variety">Variety</li>
                <li class="dropdown-menu-item" data-page="examination">Examination Status</li>
                <li class="dropdown-menu-item" data-page="signatories">Signatories</li>
                <li class="dropdown-menu-item" data-page="client">Client</li>
                <li class="dropdown-menu-last" data-page="client"></li>
            </ul>
            </ul>
            
        </ul>
    </nav>

    <script>
        // Page navigation mapping
        const pageLinks = {
            'home': 'home.html',
            'accountable': 'accountable.html',
            'transaction': 'transaction.html',
            'inventory': 'inventory.html',
            'report': 'report.html',
            'activity': 'activity_library.html',
            'cereal': 'cereal_library.html',
            'location': 'location_library.html',
            'sack': 'sack_library.html',
            'warehouse-lib': 'warehouse_library.html',
            'variety': 'variety_library.html',
            'examination': '#examination',
            'signatories': '#signatories',
            'client': '#client',
            'warehouses': '#warehouses',
            'compliance': '#compliance',
            'documentation': '#documentation',
            'notifications': '#notifications',
            'users': '#users',
            'settings': '#settings'
        };

        // Toggle dropdown menu
        function toggleDropdown() {
            const dropdown = document.getElementById('libraryDropdown');
            const arrow = document.getElementById('dropdownArrow');
            dropdown.classList.toggle('open');
            arrow.classList.toggle('open');
        }

        // Get current page from URL
        function getCurrentPage() {
            const path = window.parent.location.pathname;
            const filename = path.split('/').pop();
            
            if (filename === 'home.html' || filename === '') return 'home';
            if (filename === 'accountable.html') return 'accountable';
            if (filename === 'transaction.html') return 'transaction';
            if (filename === 'inventory.html') return 'inventory';
            if (filename === 'report.html') return 'report';
            if (filename === 'activity_library.html') return 'activity';
            if (filename === 'cereal_library.html') return 'cereal';
            if (filename === 'location_library.html') return 'location';
            if (filename === 'sack_library.html') return 'sack';
            if (filename === 'warehouse_library.html') return 'warehouse-lib';
            if (filename === 'variety_library.html') return 'variety';
            
            return null;
        }

        // Check if current page is in library dropdown
        function isLibraryPage() {
            const currentPage = getCurrentPage();
            const libraryPages = ['activity', 'cereal', 'location', 'sack', 'warehouse-lib', 'variety', 'examination', 'signatories', 'client'];
            return libraryPages.includes(currentPage);
        }

        // Set active menu item based on current page
        function setActiveMenuItem() {
            const currentPage = getCurrentPage();
            if (currentPage) {
                const menuItems = document.querySelectorAll('.menu-item:not(.dropdown-item)');
                menuItems.forEach(item => {
                    item.classList.remove('active');
                    if (item.getAttribute('data-page') === currentPage) {
                        item.classList.add('active');
                    }
                });

                // Highlight dropdown menu items
                const dropdownItems = document.querySelectorAll('.dropdown-menu-item');
                dropdownItems.forEach(item => {
                    item.classList.remove('active');
                    if (item.getAttribute('data-page') === currentPage) {
                        item.classList.add('active');
                    }
                });

                // Keep dropdown open if on a library page
                if (isLibraryPage()) {
                    const dropdown = document.getElementById('libraryDropdown');
                    const arrow = document.getElementById('dropdownArrow');
                    dropdown.classList.add('open');
                    arrow.classList.add('open');
                }
            }
        }

        // Add click handlers to menu items
        document.querySelectorAll('.menu-item:not(.dropdown-item)').forEach(item => {
            item.addEventListener('click', function() {
                const page = this.getAttribute('data-page');
                const link = pageLinks[page];
                
                if (link && link.startsWith('#')) {
                    // For pages not yet created, show alert
                    alert('Page "' + this.textContent.trim() + '" - Coming soon!');
                } else if (link) {
                    // Navigate to the page in parent window
                    window.parent.location.href = link;
                }
            });
        });

        // Add click handlers to dropdown menu items
        document.querySelectorAll('.dropdown-menu-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.stopPropagation();
                const page = this.getAttribute('data-page');
                const link = pageLinks[page];
                
                if (link && link.startsWith('#')) {
                    alert('Library: ' + this.textContent.trim() + ' - Coming soon!');
                } else if (link) {
                    window.parent.location.href = link;
                }
            });
        });

        // Set active menu item on load
        setActiveMenuItem();
        
        // Update active state when page changes (for iframe usage)
        window.addEventListener('message', function(event) {
            if (event.data.type === 'pageChange') {
                setActiveMenuItem();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variety Library - NFA Inventory</title>
    <link rel="stylesheet" href="css/variety.css" />
</head>
<body>
    <iframe src="sidebar.html" style="width: 250px; height: 100vh; border: none; position: fixed; left: 0; top: 0;"></iframe>

     <div class="main-content">
        <div class="header">
            <div class="header-left">
                <div class="icon-badge">📚</div>
                <div class="header-text">
                    <h1>Variety Library</h1>
                    <p class="header-subtitle">Manage and organize all variety records</p>
                </div>
            </div>
            <div class="header-right">
                <div class="user-info">
                <div class="user-details">
                    <div class="user-name" id="displayUsername">Hi, User</div>
                    <div class="user-role" id="displayUserRole">USER</div>
                </div>
                <div class="user-avatar" id="displayAvatar">U</div>
            </div>
            </div>
        </div>

        <div class="controls">
            <div class="sort-section">
                <span class="sort-icon">📊</span>
                <label>Sort by:</label>
                <select class="sort-select" id="sortSelect">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="code-asc">Code (A-Z)</option>
                    <option value="code-desc">Code (Z-A)</option>
                </select>
            </div>
            <div class="button-group">
                <button class="btn btn-preview" id="previewBtn">
                    <span class="btn-icon">👁</span>
                    <span>Preview</span>
                </button>
                <button class="btn btn-add" id="addVarietyBtn">
                    <span class="btn-icon">+</span>
                    <span>Add Variety</span>
                </button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th><span class="th-content">📋 VARIETY CODE</span></th>
                        <th><span class="th-content">📝 DESCRIPTION</span></th>
                        <th><span class="th-content">🌾 CEREAL TYPE</span></th>
                    </tr>
                </thead>
                <tbody id="varietyTableBody">
                    <tr>
                        <td colspan="3" style="text-align:center;">Loading varieties...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal-overlay" id="modalOverlay">
       <div class="modal-container">
            <div class="modal-header">
                <div class="modal-header-content">
                    <div class="modal-icon">🌾</div>
                    <h2 class="modal-title">Variety Library Entry</h2>
                </div>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="varietyForm">
                    <div class="form-group">
                        <label class="form-label">
                            <span class="label-icon">📋</span>
                            Variety Code
                        </label>
                        <input type="text" class="form-input" id="varietyCode" placeholder="Enter Variety Code" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <span class="label-icon">📝</span>
                            Description
                        </label>
                        <input type="text" class="form-input" id="description" placeholder="Enter Description">
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <span class="label-icon">🌾</span>
                            Cereal Type
                        </label>
                        <input type="text" class="form-input" id="cerealType" placeholder="Enter Cereal Type" required>
                    </div>

                    <button type="submit" class="btn-save">
                        <span class="btn-icon">💾</span>
                        Save Variety
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script>
        // ===================== FIREBASE CONFIGURATION =====================
        const firebaseConfig = {
            apiKey: "AIzaSyB_hLdWDYdBsZFmhTFpg4QIzdOiB9JxxIw",
            authDomain: "nfa-main.firebaseapp.com",
            databaseURL: "https://nfa-main-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nfa-main",
            storageBucket: "nfa-main.firebasestorage.app",
            messagingSenderId: "314192469082",
            appId: "1:314192469082:web:2f301895179a22dbe68c63",
            measurementId: "G-ZEJP0S67SY"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        console.log("Firebase initialized:", firebase.apps.length > 0);

        // ===================== GLOBAL VARIABLES =====================
        let allVarieties = [];
        let currentSortOrder = 'newest';
        let activeRowId = null;

       // ===================== MODAL CONTROLS =====================
        const modalOverlay = document.getElementById('modalOverlay');
        const addVarietyBtn = document.getElementById('addVarietyBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const varietyForm = document.getElementById('varietyForm');

        // Open modal
        addVarietyBtn.addEventListener('click', () => {
            varietyForm.reset();
            varietyForm.removeAttribute('data-edit-id');
            modalOverlay.classList.add('show');
        });

        // Close modal
        closeModalBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('show');
        });

        // Close modal when clicking outside
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('show');
            }
        });

        // Close modal with ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                modalOverlay.classList.remove('show');
            }
        });

        // ===================== SAVE VARIETY =====================
        varietyForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const form = e.target;
            const editId = form.getAttribute('data-edit-id');

            const varietyCode = document.getElementById('varietyCode').value.trim();
            const description = document.getElementById('description').value.trim();
            const cerealType = document.getElementById('cerealType').value.trim();

            // Clear previous errors
            document.querySelectorAll('input').forEach(field => {
                field.style.border = '';
            });
            document.querySelectorAll('.field-error-message').forEach(msg => msg.remove());

            // Validate required fields
            let hasEmptyFields = false;
            const requiredFields = [
                { id: 'varietyCode', value: varietyCode, label: 'Variety Code' },
                { id: 'cerealType', value: cerealType, label: 'Cereal Type' }
            ];

            requiredFields.forEach(field => {
                if (!field.value) {
                    const element = document.getElementById(field.id);
                    element.style.border = '2px solid #D32F2F';
                    hasEmptyFields = true;
                    
                    const errorMsg = document.createElement('div');
                    errorMsg.className = 'field-error-message';
                    errorMsg.textContent = 'This field is required';
                    element.parentElement.appendChild(errorMsg);
                }
            });

            if (hasEmptyFields) {
                const firstEmptyField = document.querySelector('[style*="border: 2px solid"]');
                if (firstEmptyField) {
                    firstEmptyField.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    firstEmptyField.focus();
                }
                return;
            }

            const varietyData = { 
                varietyCode, 
                description, 
                cerealType, 
                timestamp: Date.now() 
            };

            if (editId) {
                // Update existing variety
                varietyData.updatedAt = new Date().toISOString();
                database.ref('varieties/' + editId).update(varietyData)
                    .then(() => {
                        alert('✅ Variety updated successfully!');
                        form.reset();
                        form.removeAttribute('data-edit-id');
                        modalOverlay.classList.remove('show');
                    })
                    .catch((error) => {
                        console.error('Error updating variety:', error);
                        alert('❌ Error updating variety: ' + error.message);
                    });
            } else {
                // Create new variety
                varietyData.createdAt = new Date().toISOString();
                database.ref('varieties').push(varietyData)
                    .then(() => {
                        alert('✅ Variety added successfully!');
                        form.reset();
                        modalOverlay.classList.remove('show');
                    })
                    .catch((error) => {
                        console.error('Error adding variety:', error);
                        alert('❌ Error adding variety: ' + error.message);
                    });
            }
        });

        // ===================== LOAD VARIETIES FROM FIREBASE =====================
        function loadVarieties() {
            const tbody = document.getElementById('varietyTableBody');
            const varietiesRef = database.ref('varieties');

            varietiesRef.on('value', (snapshot) => {
                allVarieties = [];

                if (!snapshot.exists()) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="3" style="text-align:center;">No varieties found</td>
                        </tr>`;
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    const docId = childSnapshot.key;
                    
                    allVarieties.push({
                        id: docId,
                        data: data
                    });
                });
                
                sortVarieties(currentSortOrder);
            }, (error) => {
                console.error('Error loading varieties:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" style="text-align:center; color: #D32F2F;">Error loading varieties: ${error.message}</td>
                    </tr>`;
            });
        }

        // ===================== SORT VARIETIES =====================
        function sortVarieties(order) {
            currentSortOrder = order;
            
            allVarieties.sort((a, b) => {
                if (order === 'newest' || order === 'oldest') {
                    const dateA = a.data.timestamp || 0;
                    const dateB = b.data.timestamp || 0;
                    return order === 'newest' ? dateB - dateA : dateA - dateB;
                } else if (order === 'code-asc' || order === 'code-desc') {
                    const codeA = (a.data.varietyCode || '').toLowerCase();
                    const codeB = (b.data.varietyCode || '').toLowerCase();
                    return order === 'code-asc' ? codeA.localeCompare(codeB) : codeB.localeCompare(codeA);
                }
            });
            
            renderVarieties();
        }

        // ===================== RENDER VARIETIES =====================
        function renderVarieties() {
            const tbody = document.getElementById('varietyTableBody');
            tbody.innerHTML = '';

            if (allVarieties.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" style="text-align:center;">No varieties found</td>
                    </tr>`;
                return;
            }

            allVarieties.forEach(item => {
                const d = item.data;
                const tr = document.createElement('tr');
                tr.className = 'data-row';
                tr.dataset.id = item.id;
                
                tr.innerHTML = `
                    <td><span class="code-badge">${d.varietyCode || '-'}</span></td>
                    <td>${d.description || '-'}</td>
                    <td><span class="cereal-tag">${d.cerealType || '-'}</span></td>
                `;
                
                tbody.appendChild(tr);
            });

            attachRowListeners();
        }

        // ===================== ROW CLICK HANDLERS =====================
        function attachRowListeners() {
            document.querySelectorAll('.data-row').forEach(row => {
                row.addEventListener('click', (e) => {
                    const rowId = row.dataset.id;
                    
                    // Check if buttons are already showing
                    const existingButtons = document.querySelector('.floating-action-buttons');
                    
                    if (activeRowId === rowId) {
                        // Hide buttons if clicking same row
                        if (existingButtons) existingButtons.remove();
                        row.classList.remove('active');
                        activeRowId = null;
                    } else {
                        // Remove previous buttons and highlight
                        if (existingButtons) existingButtons.remove();
                        document.querySelectorAll('.data-row.active').forEach(r => r.classList.remove('active'));
                        
                        // Add new buttons
                        row.classList.add('active');
                        activeRowId = rowId;
                        
                        const buttonContainer = document.createElement('div');
                        buttonContainer.className = 'floating-action-buttons';
                        buttonContainer.innerHTML = `
                            <button class="action-btn-edit" data-id="${rowId}">
                                <span>✏️</span>
                                <span>Edit Transaction</span>
                            </button>
                            <button class="action-btn-delete" data-id="${rowId}">
                                <span>🗑️</span>
                                <span>Delete Transaction</span>
                            </button>
                        `;
                        
                        document.querySelector('.table-container').appendChild(buttonContainer);
                        
                        // Attach event listeners
                        buttonContainer.querySelector('.action-btn-edit').addEventListener('click', (e) => {
                            e.stopPropagation();
                            editVariety(rowId);
                        });
                        
                        buttonContainer.querySelector('.action-btn-delete').addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (confirm('🗑️ Are you sure you want to delete this variety?')) {
                                deleteVariety(rowId);
                            }
                        });
                    }
                });
            });
        }

        // ===================== EDIT VARIETY =====================
        function editVariety(id) {
            database.ref('varieties/' + id).once('value')
                .then((snapshot) => {
                    if (!snapshot.exists()) {
                        alert('❌ Variety not found!');
                        return;
                    }
                    
                    const data = snapshot.val();
                    
                    document.getElementById('varietyCode').value = data.varietyCode || '';
                    document.getElementById('description').value = data.description || '';
                    document.getElementById('cerealType').value = data.cerealType || '';
                    
                    varietyForm.setAttribute('data-edit-id', id);
                    modalOverlay.classList.add('show');
                })
                .catch((error) => {
                    console.error('Error loading variety:', error);
                    alert('❌ Error loading variety: ' + error.message);
                });
        }

        // ===================== DELETE VARIETY =====================
        function deleteVariety(id) {
            database.ref('varieties/' + id).remove()
                .then(() => {
                    alert('✅ Variety deleted successfully!');
                    activeRowId = null;
                })
                .catch((error) => {
                    console.error('Error deleting variety:', error);
                    alert('❌ Error deleting variety: ' + error.message);
                });
        }

        // ===================== SORT SELECT HANDLER =====================
        document.getElementById('sortSelect').addEventListener('change', (e) => {
            sortVarieties(e.target.value);
        });

        // ===================== PREVIEW BUTTON =====================
        document.getElementById('previewBtn').addEventListener('click', () => {
            window.open('variety_preview.html');
        });

        // ===================== HEADER SCROLL EFFECT =====================
        window.addEventListener('scroll', () => {
            const header = document.querySelector('.header');
            if (window.scrollY > 0) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // ===================== INIT =====================
        window.addEventListener('DOMContentLoaded', () => {
            console.log('Variety Library page loaded');
            loadVarieties();
        });
    </script>
</body>
</html>

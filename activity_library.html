<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Library - NFA Inventory System</title>
    <link rel="stylesheet" href="css/activity.css" />
</head>
<body>
    <iframe src="sidebar.html" style="width: 250px; height: 100vh; border: none; position: fixed; left: 0; top: 0;"></iframe>

    <div class="main-content">
        <div class="header">
            <div class="header-left">
                <h1>Activity Library</h1>
                <p style="color: #6B7C6B; font-size: 0.9rem; margin-top: 0.25rem;">Manage and organize all activity records</p>
            </div>
            <div class="header-right">
                <div class="user-info">
                    <div class="user-greeting">Hi, nfa_admin</div>
                    <div class="user-role">Administrator</div>
                </div>
                <div class="user-avatar">N</div>
            </div>
        </div>

        <div class="controls">
            <div class="sort-section">
                <label>📊 Sort by:</label>
                <select class="sort-select" id="sortSelect">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="code-asc">Code (A-Z)</option>
                    <option value="code-desc">Code (Z-A)</option>
                </select>
            </div>
            <div class="button-group">
                <button class="btn btn-preview" id="previewBtn">
                    <span>👁️</span>
                    <span>Preview</span>
                </button>
                <button class="btn btn-add" id="addActivityBtn">
                    <span>➕</span>
                    <span>Add Activity</span>
                </button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>🔖 ACTIVITY CODE</th>
                        <th>📝 DESCRIPTION</th>
                        <th>🏷️ ABBREVIATION</th>
                        <th>✅ INCLUDE IN TA</th>
                        <th>🏭 IN-WHSE. ACT.</th>
                    </tr>
                </thead>
                <tbody id="activityTableBody">
                    <tr>
                        <td colspan="5" style="text-align:center; padding: 3rem; color: #6B7C6B;">
                            <div style="font-size: 3rem; margin-bottom: 1rem;">🌾</div>
                            <div style="font-size: 1.1rem; font-weight: 600; color: #1B5E20;">Loading activities...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="activityModal">
        <div class="modal-container">
            <div class="modal-header">
                <h2 class="modal-title">📋 DATA ENTRY OF ACTIVITY LIBRARY</h2>
                <button class="close-btn" id="closeModalBtn">×</button>
            </div>

            <div class="modal-body">
                <form id="activityForm">
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label class="form-label">🔖 Activity Code: <span style="color: #C62828;">*</span></label>
                            <input type="text" class="form-input" id="activityCode" required placeholder="Enter activity code">
                        </div>

                        <div class="form-group full-width">
                            <label class="form-label">📝 Description <span style="color: #C62828;">*</span></label>
                            <input type="text" class="form-input" id="description" required placeholder="Enter description">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">🏷️ Abbreviation</label>
                                <input type="text" class="form-input" id="abbreviation" placeholder="Enter abbreviation">
                            </div>
                            <div class="form-group">
                                <label class="form-label">✅ Include in TA:</label>
                                <input type="text" class="form-input" id="includeInTA" placeholder="Yes/No">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">🏭 In-Whse. Act:</label>
                                <input type="text" class="form-input" id="inWhseAct" placeholder="Yes/No">
                            </div>
                            <div class="form-group">
                                <label class="form-label">📅 Transaction Date</label>
                                <input type="date" class="form-input" id="transactionDate">
                            </div>
                        </div>

                        <div class="form-group full-width">
                            <button type="submit" class="btn-save">💾 Save Transaction</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script>
        // ===================== FIREBASE CONFIGURATION =====================
        const firebaseConfig = {
            apiKey: "AIzaSyB_hLdWDYdBsZFmhTFpg4QIzdOiB9JxxIw",
            authDomain: "nfa-main.firebaseapp.com",
            databaseURL: "https://nfa-main-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nfa-main",
            storageBucket: "nfa-main.firebasestorage.app",
            messagingSenderId: "314192469082",
            appId: "1:314192469082:web:2f301895179a22dbe68c63",
            measurementId: "G-ZEJP0S67SY"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        console.log("Firebase initialized:", firebase.apps.length > 0);

        // ===================== GLOBAL VARIABLES =====================
        let allActivities = [];
        let currentSortOrder = 'newest';
        let activeRowId = null; // ← ADDED: tracks currently selected row (same as Variety)

        // ===================== MODAL CONTROLS =====================
        const activityModal = document.getElementById('activityModal');
        const addActivityBtn = document.getElementById('addActivityBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const activityForm = document.getElementById('activityForm');

        // Open modal
        addActivityBtn.addEventListener('click', () => {
            activityForm.reset();
            activityForm.removeAttribute('data-edit-id');
            activityModal.classList.add('active');
        });

        // Close modal
        closeModalBtn.addEventListener('click', () => {
            activityModal.classList.remove('active');
        });

        // Close modal when clicking outside
        activityModal.addEventListener('click', (e) => {
            if (e.target === activityModal) {
                activityModal.classList.remove('active');
            }
        });

        // Close modal with ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                activityModal.classList.remove('active');
            }
        });

        // ===================== FORM SUBMIT (SAVE / UPDATE) =====================
        activityForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const form = e.target;
            const editId = form.getAttribute('data-edit-id');
            
            const activityData = {
                activityCode: document.getElementById('activityCode').value || "",
                description: document.getElementById('description').value || "",
                abbreviation: document.getElementById('abbreviation').value || "",
                includeTA: document.getElementById('includeInTA').value || "",
                inWhse: document.getElementById('inWhseAct').value || "",
                transactionDate: document.getElementById('transactionDate').value || "",
                timestamp: Date.now()
            };

            // Clear previous errors
            document.querySelectorAll('input, select').forEach(field => {
                field.style.border = '';
            });
            document.querySelectorAll('.field-error-message').forEach(msg => msg.remove());
            
            // Validate required fields
            let hasEmptyFields = false;
            const requiredFields = [
                { id: 'activityCode', label: 'Activity Code' },
                { id: 'description', label: 'Description' }
            ];
            
            requiredFields.forEach(field => {
                const element = document.getElementById(field.id);
                if (!element.value.trim()) {
                    element.style.border = '2px solid #C62828';
                    hasEmptyFields = true;
                    
                    const errorMsg = document.createElement('div');
                    errorMsg.className = 'field-error-message';
                    errorMsg.textContent = '⚠️ This field is required';
                    element.parentElement.appendChild(errorMsg);
                }
            });
            
            if (hasEmptyFields) {
                const firstEmptyField = document.querySelector('[style*="border: 2px solid"]');
                if (firstEmptyField) {
                    firstEmptyField.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    firstEmptyField.focus();
                }
                return;
            }
            
            if (editId) {
                // Update existing activity
                activityData.updatedAt = new Date().toISOString();
                database.ref('activities/' + editId).update(activityData)
                    .then(() => {
                        alert('✅ Activity updated successfully!');
                        activityModal.classList.remove('active');
                        form.reset();
                        form.removeAttribute('data-edit-id');
                        activeRowId = null;
                    })
                    .catch((error) => {
                        console.error('Error updating activity:', error);
                        alert('❌ Error updating activity: ' + error.message);
                    });
            } else {
                // Create new activity
                activityData.createdAt = new Date().toISOString();
                database.ref('activities').push(activityData)
                    .then(() => {
                        alert('✅ Activity saved successfully!');
                        activityModal.classList.remove('active');
                        form.reset();
                    })
                    .catch((error) => {
                        console.error('Error saving activity:', error);
                        alert('❌ Error saving activity: ' + error.message);
                    });
            }
        });

        // ===================== SORT ACTIVITIES =====================
        function sortActivities(order) {
            currentSortOrder = order;
            
            allActivities.sort((a, b) => {
                if (order === 'newest' || order === 'oldest') {
                    const dateA = new Date(a.data.transactionDate || a.data.createdAt || '1900-01-01');
                    const dateB = new Date(b.data.transactionDate || b.data.createdAt || '1900-01-01');
                    return order === 'newest' ? dateB - dateA : dateA - dateB;
                } else if (order === 'code-asc' || order === 'code-desc') {
                    const codeA = (a.data.activityCode || '').toLowerCase();
                    const codeB = (b.data.activityCode || '').toLowerCase();
                    return order === 'code-asc' ? codeA.localeCompare(codeB) : codeB.localeCompare(codeA);
                }
            });
            
            renderActivities();
        }

        // ===================== RENDER ACTIVITIES =====================
        function renderActivities() {
            const tbody = document.getElementById('activityTableBody');
            tbody.innerHTML = '';
            
            if (allActivities.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align:center; padding: 3rem; color: #6B7C6B;">
                            <div style="font-size: 3rem; margin-bottom: 1rem;">🌾</div>
                            <div style="font-size: 1.1rem; font-weight: 600; color: #1B5E20;">No activities found</div>
                            <div style="font-size: 0.9rem; margin-top: 0.5rem;">Click "Add Activity" to create your first entry</div>
                        </td>
                    </tr>`;
                return;
            }
            
            allActivities.forEach(item => {
                const data = item.data;
                const docId = item.docId;
                
                const tr = document.createElement('tr');
                tr.classList.add('data-row');
                tr.dataset.id = docId; // ← CHANGED: use dataset.id (same pattern as Variety)
                tr.innerHTML = `
                    <td>${data.activityCode || '-'}</td>
                    <td>${data.description || '-'}</td>
                    <td>${data.abbreviation || '-'}</td>
                    <td>${data.includeTA || '-'}</td>
                    <td>${data.inWhse || '-'}</td>
                `;
                
                tbody.appendChild(tr);
            });
            
            attachRowClickListeners();
        }

        // ===================== ROW CLICK → FLOATING BUTTONS =====================
        // ← REWRITTEN: exact same toggle logic as the working Variety page
        function attachRowClickListeners() {
            document.querySelectorAll('.data-row').forEach(row => {
                row.addEventListener('click', (e) => {
                    const rowId = row.dataset.id;

                    // Reference to any existing floating buttons
                    const existingButtons = document.querySelector('.floating-action-buttons');

                    if (activeRowId === rowId) {
                        // --- Clicking the SAME row → hide buttons (toggle off) ---
                        if (existingButtons) existingButtons.remove();
                        row.classList.remove('row-selected');
                        activeRowId = null;
                    } else {
                        // --- Clicking a DIFFERENT row → move buttons there ---

                        // 1. Remove old buttons & highlight
                        if (existingButtons) existingButtons.remove();
                        document.querySelectorAll('.data-row.row-selected').forEach(r => r.classList.remove('row-selected'));

                        // 2. Highlight the new row
                        row.classList.add('row-selected');
                        activeRowId = rowId;

                        // 3. Create floating Edit / Delete buttons
                        const buttonContainer = document.createElement('div');
                        buttonContainer.className = 'floating-action-buttons';
                        buttonContainer.innerHTML = `
                            <button class="action-btn-edit" data-id="${rowId}">
                                <span>✏️</span>
                                <span>Edit Transaction</span>
                            </button>
                            <button class="action-btn-delete" data-id="${rowId}">
                                <span>🗑️</span>
                                <span>Delete Transaction</span>
                            </button>
                        `;

                        // Append to body so position:fixed works reliably
                        document.body.appendChild(buttonContainer);

                        // 4. Wire up Edit
                        buttonContainer.querySelector('.action-btn-edit').addEventListener('click', (e) => {
                            e.stopPropagation();
                            editActivity(rowId);
                        });

                        // 5. Wire up Delete
                        buttonContainer.querySelector('.action-btn-delete').addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (confirm('🗑️ Are you sure you want to delete this activity?')) {
                                deleteActivity(rowId);
                            }
                        });
                    }
                });
            });
        }

        // ===================== EDIT ACTIVITY =====================
        function editActivity(docId) {
            database.ref('activities/' + docId).once('value')
                .then((snapshot) => {
                    if (!snapshot.exists()) {
                        alert('❌ Activity not found!');
                        return;
                    }
                    
                    const data = snapshot.val();
                    
                    document.getElementById('activityCode').value  = data.activityCode || '';
                    document.getElementById('description').value   = data.description || '';
                    document.getElementById('abbreviation').value  = data.abbreviation || '';
                    document.getElementById('includeInTA').value   = data.includeTA || '';
                    document.getElementById('inWhseAct').value     = data.inWhse || '';
                    document.getElementById('transactionDate').value = data.transactionDate || '';
                    
                    activityForm.setAttribute('data-edit-id', docId);
                    activityModal.classList.add('active');
                })
                .catch((error) => {
                    console.error('Error loading activity:', error);
                    alert('❌ Error loading activity: ' + error.message);
                });
        }

        // ===================== DELETE ACTIVITY =====================
        function deleteActivity(docId) {
            database.ref('activities/' + docId).remove()
                .then(() => {
                    alert('✅ Activity deleted successfully!');
                    activeRowId = null; // ← reset tracker after delete
                })
                .catch((error) => {
                    console.error('Error deleting activity:', error);
                    alert('❌ Error deleting activity: ' + error.message);
                });
        }

        // ===================== LOAD ACTIVITIES FROM FIREBASE =====================
        function loadActivities() {
            const tbody = document.getElementById('activityTableBody');
            const activitiesRef = database.ref('activities');

            activitiesRef.on('value', (snapshot) => {
                allActivities = [];

                if (!snapshot.exists()) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" style="text-align:center; padding: 3rem; color: #6B7C6B;">
                                <div style="font-size: 3rem; margin-bottom: 1rem;">🌾</div>
                                <div style="font-size: 1.1rem; font-weight: 600; color: #1B5E20;">No activities found</div>
                                <div style="font-size: 0.9rem; margin-top: 0.5rem;">Click "Add Activity" to create your first entry</div>
                            </td>
                        </tr>`;
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    allActivities.push({
                        docId: childSnapshot.key,
                        data: childSnapshot.val()
                    });
                });
                
                sortActivities(currentSortOrder);
            }, (error) => {
                console.error('Error loading activities:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align:center; color: #C62828; padding: 3rem;">
                            <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                            <div style="font-size: 1.1rem; font-weight: 600;">Error loading activities</div>
                            <div style="font-size: 0.9rem; margin-top: 0.5rem;">${error.message}</div>
                        </td>
                    </tr>`;
            });
        }

        // ===================== SORT SELECT HANDLER =====================
        document.getElementById('sortSelect').addEventListener('change', (e) => {
            sortActivities(e.target.value);
        });

        // ===================== PREVIEW BUTTON =====================
        document.getElementById('previewBtn').addEventListener('click', () => {
            window.open('activity-preview.html');
        });

        // ===================== INIT =====================
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🌾 Activity Library page loaded');
            loadActivities();
        });

        // ===================== HEADER SCROLL EFFECT =====================
        window.addEventListener('scroll', () => {
            const header = document.querySelector('.header');
            if (window.scrollY > 0) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>

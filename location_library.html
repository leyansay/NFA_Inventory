<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Library - NFA Inventory</title>
    <link rel="stylesheet" href="css/location.css" />
</head>
<body>
    <iframe src="sidebar.html" style="width: 250px; height: 100vh; border: none; position: fixed; left: 0; top: 0;"></iframe>

    <div class="main-content">
        <div class="header">
            <div class="header-left">
                <h1>Location Library</h1>
            </div>
            <div class="header-right">
                <div class="user-info">
                    <div class="user-greeting">Hi, nfa_admin</div>
                    <div class="user-role">User</div>
                </div>
                <div class="user-avatar">N</div>
            </div>
        </div>

        <div class="controls">
            <div class="sort-section">
                <label>Sort by:</label>
                <select class="sort-select" id="sortSelect">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="code-asc">Code (A-Z)</option>
                    <option value="code-desc">Code (Z-A)</option>
                </select>
            </div>
            <div class="button-group">
                <button class="btn btn-preview" onclick="previewLocations()">
                    <span>Preview</span>
                </button>
                <button class="btn btn-add" onclick="openModal()">
                    <span>+</span>
                    <span>Add Location</span>
                </button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>LOCATION CODE</th>
                        <th>PROVINCE NAME</th>
                        <th>ABBREVIATION</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="locationTableBody">
                    <tr>
                        <td colspan="4" style="text-align:center;">Loading locations...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="locationModal">
        <div class="modal-container">
            <div class="modal-header">
                <h2 class="modal-title">DATA ENTRY OF LOCATION LIBRARY</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>

            <div class="modal-body">
                <form id="locationForm">
                    <!-- Location Code -->
                    <div class="form-group">
                        <label class="form-label">Location Code:</label>
                        <input type="text" class="form-input" id="locationCode" placeholder="Enter Location Code" required>
                    </div>

                    <!-- Province Name -->
                    <div class="form-group">
                        <label class="form-label">Province Name:</label>
                        <input type="text" class="form-input" id="provinceName" placeholder="Enter Province Name" required>
                    </div>

                    <!-- Abbreviation -->
                    <div class="form-group">
                        <label class="form-label">Abbreviation:</label>
                        <input type="text" class="form-input" id="abbreviation" placeholder="Enter Abbreviation" required>
                    </div>

                    <!-- Save Button -->
                    <button type="submit" class="btn-save">Save Location</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <!-- Location Firebase Script -->
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB_hLdWDYdBsZFmhTFpg4QIzdOiB9JxxIw",
            authDomain: "nfa-main.firebaseapp.com",
            databaseURL: "https://nfa-main-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nfa-main",
            storageBucket: "nfa-main.firebasestorage.app",
            messagingSenderId: "314192469082",
            appId: "1:314192469082:web:2f301895179a22dbe68c63",
            measurementId: "G-ZEJP0S67SY"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        console.log("Firebase initialized:", firebase.apps.length > 0);

        // Global variables
        let allLocations = [];
        let currentSortOrder = 'newest';

        // Open Modal
        function openModal() {
            const form = document.getElementById('locationForm');
            form.reset();
            form.removeAttribute('data-edit-id');
            document.getElementById('locationModal').classList.add('active');
        }

        // Close Modal
        function closeModal() {
            document.getElementById('locationModal').classList.remove('active');
        }

        // Close modal when clicking outside
        document.getElementById('locationModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Close modal with ESC key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Form Submit Handler
        document.getElementById('locationForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const form = e.target;
            const editId = form.getAttribute('data-edit-id');

            const locationData = {
                locationCode: document.getElementById('locationCode').value || "",
                provinceName: document.getElementById('provinceName').value || "",
                abbreviation: document.getElementById('abbreviation').value || "",
                timestamp: Date.now()
            };

            // Clear previous errors
            document.querySelectorAll('input').forEach(field => {
                field.style.border = '';
            });
            document.querySelectorAll('.field-error-message').forEach(msg => msg.remove());

            // Validate required fields
            let hasEmptyFields = false;
            const requiredFields = [
                { id: 'locationCode', label: 'Location Code' },
                { id: 'provinceName', label: 'Province Name' },
                { id: 'abbreviation', label: 'Abbreviation' }
            ];

            requiredFields.forEach(field => {
                const element = document.getElementById(field.id);
                if (!element.value.trim()) {
                    element.style.border = '2px solid #ff6b6b';
                    hasEmptyFields = true;

                    const errorMsg = document.createElement('div');
                    errorMsg.className = 'field-error-message';
                    errorMsg.style.color = '#ff6b6b';
                    errorMsg.style.fontSize = '12px';
                    errorMsg.style.marginTop = '4px';
                    errorMsg.textContent = 'This field is required';
                    element.parentElement.appendChild(errorMsg);
                }
            });

            if (hasEmptyFields) {
                const firstEmptyField = document.querySelector('[style*="border: 2px solid"]');
                if (firstEmptyField) {
                    firstEmptyField.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    firstEmptyField.focus();
                }
                return;
            }

            if (editId) {
                // Update existing location
                locationData.updatedAt = new Date().toISOString();
                const locationRef = database.ref('locations/' + editId);

                locationRef.update(locationData)
                    .then(() => {
                        alert('Location updated successfully!');
                        closeModal();
                        form.reset();
                        form.removeAttribute('data-edit-id');
                    })
                    .catch((error) => {
                        console.error('Error updating location:', error);
                        alert('Error updating location: ' + error.message);
                    });
            } else {
                // Create new location
                locationData.createdAt = new Date().toISOString();
                const locationsRef = database.ref('locations');
                const newLocationRef = locationsRef.push();

                newLocationRef.set(locationData)
                    .then(() => {
                        alert('Location saved successfully!');
                        closeModal();
                        form.reset();
                    })
                    .catch((error) => {
                        console.error('Error saving location:', error);
                        alert('Error saving location: ' + error.message);
                    });
            }
        });

        // Sort locations
        function sortLocations(order) {
            currentSortOrder = order;

            allLocations.sort((a, b) => {
                if (order === 'newest' || order === 'oldest') {
                    const dateA = new Date(a.data.createdAt || '1900-01-01');
                    const dateB = new Date(b.data.createdAt || '1900-01-01');
                    return order === 'newest' ? dateB - dateA : dateA - dateB;
                } else if (order === 'code-asc' || order === 'code-desc') {
                    const codeA = (a.data.locationCode || '').toLowerCase();
                    const codeB = (b.data.locationCode || '').toLowerCase();
                    return order === 'code-asc' ? codeA.localeCompare(codeB) : codeB.localeCompare(codeA);
                }
            });

            renderLocations();
        }

        // Render locations to table
        function renderLocations() {
            const tbody = document.getElementById('locationTableBody');
            tbody.innerHTML = '';

            if (allLocations.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align:center;">No locations found</td>
                    </tr>`;
                return;
            }

            allLocations.forEach(item => {
                const data = item.data;
                const docId = item.docId;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${data.locationCode || '-'}</td>
                    <td>${data.provinceName || '-'}</td>
                    <td>${data.abbreviation || '-'}</td>
                    <td class="actions-cell">
                        <button class="action-btn" data-doc-id="${docId}" title="More actions">⋮</button>
                        <div class="dropdown-menu">
                            <button class="dropdown-item" data-action="edit" data-doc-id="${docId}">
                                <span>✏️</span> Edit
                            </button>
                            <button class="dropdown-item delete-item" data-action="delete" data-doc-id="${docId}">
                                <span>🗑️</span> Delete
                            </button>
                        </div>
                    </td>
                `;

                tbody.appendChild(tr);
            });

            attachDropdownListeners();
        }

        // Attach dropdown listeners
        function attachDropdownListeners() {
            document.querySelectorAll('.action-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    closeAllDropdowns();
                    const dropdown = btn.nextElementSibling;
                    dropdown.classList.toggle('show');
                });
            });

            document.querySelectorAll('.dropdown-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const docId = item.dataset.docId;
                    const action = item.dataset.action;

                    closeAllDropdowns();

                    if (action === 'edit') {
                        editLocation(docId);
                    } else if (action === 'delete') {
                        if (confirm('Are you sure you want to delete this location?')) {
                            deleteLocation(docId);
                        }
                    }
                });
            });
        }

        // Close all dropdowns
        function closeAllDropdowns() {
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                menu.classList.remove('show');
            });
        }

        // Close dropdowns when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.action-btn')) {
                closeAllDropdowns();
            }
        });

        // Edit location
        function editLocation(docId) {
            const locationRef = database.ref('locations/' + docId);

            locationRef.once('value')
                .then((snapshot) => {
                    if (!snapshot.exists()) {
                        alert('Location not found!');
                        return;
                    }

                    const data = snapshot.val();

                    document.getElementById('locationCode').value = data.locationCode || '';
                    document.getElementById('provinceName').value = data.provinceName || '';
                    document.getElementById('abbreviation').value = data.abbreviation || '';

                    document.getElementById('locationForm').setAttribute('data-edit-id', docId);
                    document.getElementById('locationModal').classList.add('active');
                })
                .catch((error) => {
                    console.error('Error loading location:', error);
                    alert('Error loading location: ' + error.message);
                });
        }

        // Delete location
        function deleteLocation(docId) {
            const locationRef = database.ref('locations/' + docId);

            locationRef.remove()
                .then(() => {
                    alert('Location deleted successfully!');
                })
                .catch((error) => {
                    console.error('Error deleting location:', error);
                    alert('Error deleting location: ' + error.message);
                });
        }

        // Load locations from Firebase
        function loadLocations() {
            const tbody = document.getElementById('locationTableBody');
            const locationsRef = database.ref('locations');

            locationsRef.on('value', (snapshot) => {
                allLocations = [];

                if (!snapshot.exists()) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" style="text-align:center;">No locations found</td>
                        </tr>`;
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    const docId = childSnapshot.key;

                    allLocations.push({
                        docId: docId,
                        data: data
                    });
                });

                sortLocations(currentSortOrder);
            }, (error) => {
                console.error('Error loading locations:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align:center; color: red;">Error loading locations: ${error.message}</td>
                    </tr>`;
            });
        }

        function previewLocations() {
            alert('Opening Preview mode...');
        }

        // Sort select handler
        document.getElementById('sortSelect').addEventListener('change', (e) => {
            sortLocations(e.target.value);
        });

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            console.log('Location Library page loaded');
            loadLocations();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Library - NFA Inventory System</title>
    <link rel="stylesheet" href="css/location.css" />
</head>
<body>
    <iframe src="sidebar.html" style="width: 250px; height: 100vh; border: none; position: fixed; left: 0; top: 0;"></iframe>

    <div class="main-content">
        <div class="header">
            <div class="header-left">
                <h1>Location Library</h1>
                <p style="color: #6B7C6B; font-size: 0.9rem; margin-top: 0.25rem;">Manage and organize location records</p>
            </div>
            <div class="header-right">
                <div class="user-info">
                    <div class="user-greeting">Hi, nfa_admin</div>
                    <div class="user-role">Administrator</div>
                </div>
                <div class="user-avatar">N</div>
            </div>
        </div>

        <div class="controls">
            <div class="sort-section">
                <label>📊 Sort by:</label>
                <select class="sort-select" id="sortSelect">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="code-asc">Code (A-Z)</option>
                    <option value="code-desc">Code (Z-A)</option>
                </select>
            </div>
            <div class="button-group">
                <button class="btn btn-preview" id="previewBtn">
                    <span>👁️</span>
                    <span>Preview</span>
                </button>
                <button class="btn btn-add" id="addLocationBtn">
                    <span>➕</span>
                    <span>Add Location</span>
                </button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>🔖 LOCATION CODE</th>
                        <th>🏛️ PROVINCE NAME</th>
                        <th>🏷️ ABBREVIATION</th>
                    </tr>
                </thead>
                <tbody id="locationTableBody">
                    <tr>
                        <td colspan="3" style="text-align:center; padding: 3rem; color: #6B7C6B;">
                            <div style="font-size: 3rem; margin-bottom: 1rem;">🌾</div>
                            <div style="font-size: 1.1rem; font-weight: 600; color: #1B5E20;">Loading locations...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="locationModal">
        <div class="modal-container">
            <div class="modal-header">
                <h2 class="modal-title">📋 DATA ENTRY OF LOCATION LIBRARY</h2>
                <button class="close-btn" id="closeModalBtn">×</button>
            </div>

            <div class="modal-body">
                <form id="locationForm">
                    <div class="form-group">
                        <label class="form-label">🔖 Location Code: <span style="color: #C62828;">*</span></label>
                        <input type="text" class="form-input" id="locationCode" placeholder="Enter Location Code" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">🏛️ Province Name: <span style="color: #C62828;">*</span></label>
                        <input type="text" class="form-input" id="provinceName" placeholder="Enter Province Name" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">🏷️ Abbreviation: <span style="color: #C62828;">*</span></label>
                        <input type="text" class="form-input" id="abbreviation" placeholder="Enter Abbreviation" required>
                    </div>

                    <button type="submit" class="btn-save">💾 Save Location</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        // ===================== FIREBASE CONFIGURATION =====================
        const firebaseConfig = {
            apiKey: "AIzaSyB_hLdWDYdBsZFmhTFpg4QIzdOiB9JxxIw",
            authDomain: "nfa-main.firebaseapp.com",
            databaseURL: "https://nfa-main-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nfa-main",
            storageBucket: "nfa-main.firebasestorage.app",
            messagingSenderId: "314192469082",
            appId: "1:314192469082:web:2f301895179a22dbe68c63",
            measurementId: "G-ZEJP0S67SY"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        console.log("Firebase initialized:", firebase.apps.length > 0);

        // ===================== GLOBAL VARIABLES =====================
        let allLocations = [];
        let currentSortOrder = 'newest';
        let activeRowId = null;

        // ===================== MODAL CONTROLS =====================
        const locationModal = document.getElementById('locationModal');
        const addLocationBtn = document.getElementById('addLocationBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const locationForm = document.getElementById('locationForm');

        // Open modal
        addLocationBtn.addEventListener('click', () => {
            locationForm.reset();
            locationForm.removeAttribute('data-edit-id');
            locationModal.classList.add('active');
        });

        // Close modal
        closeModalBtn.addEventListener('click', () => {
            locationModal.classList.remove('active');
        });

        // Close modal when clicking outside
        locationModal.addEventListener('click', (e) => {
            if (e.target === locationModal) {
                locationModal.classList.remove('active');
            }
        });

        // Close modal with ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                locationModal.classList.remove('active');
            }
        });

        // ===================== FORM SUBMIT (SAVE / UPDATE) =====================
        locationForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const form = e.target;
            const editId = form.getAttribute('data-edit-id');

            const locationData = {
                locationCode: document.getElementById('locationCode').value.trim() || "",
                provinceName: document.getElementById('provinceName').value.trim() || "",
                abbreviation: document.getElementById('abbreviation').value.trim() || "",
                timestamp: Date.now()
            };

            // Clear previous errors
            document.querySelectorAll('input').forEach(field => {
                field.style.border = '';
            });
            document.querySelectorAll('.field-error-message').forEach(msg => msg.remove());

            // Validate required fields
            let hasEmptyFields = false;
            const requiredFields = [
                { id: 'locationCode',  value: locationData.locationCode },
                { id: 'provinceName',  value: locationData.provinceName },
                { id: 'abbreviation',  value: locationData.abbreviation }
            ];

            requiredFields.forEach(field => {
                if (!field.value) {
                    const element = document.getElementById(field.id);
                    element.style.border = '2px solid #C62828';
                    hasEmptyFields = true;

                    const errorMsg = document.createElement('div');
                    errorMsg.className = 'field-error-message';
                    errorMsg.textContent = '⚠️ This field is required';
                    element.parentElement.appendChild(errorMsg);
                }
            });

            if (hasEmptyFields) {
                const firstEmptyField = document.querySelector('[style*="border: 2px solid"]');
                if (firstEmptyField) {
                    firstEmptyField.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    firstEmptyField.focus();
                }
                return;
            }

            if (editId) {
                // Update existing location
                locationData.updatedAt = new Date().toISOString();
                database.ref('locations/' + editId).update(locationData)
                    .then(() => {
                        alert('✅ Location updated successfully!');
                        locationModal.classList.remove('active');
                        form.reset();
                        form.removeAttribute('data-edit-id');
                        activeRowId = null;
                    })
                    .catch((error) => {
                        console.error('Error updating location:', error);
                        alert('❌ Error updating location: ' + error.message);
                    });
            } else {
                // Create new location
                locationData.createdAt = new Date().toISOString();
                database.ref('locations').push(locationData)
                    .then(() => {
                        alert('✅ Location saved successfully!');
                        locationModal.classList.remove('active');
                        form.reset();
                    })
                    .catch((error) => {
                        console.error('Error saving location:', error);
                        alert('❌ Error saving location: ' + error.message);
                    });
            }
        });

        // ===================== SORT LOCATIONS =====================
        function sortLocations(order) {
            currentSortOrder = order;

            allLocations.sort((a, b) => {
                if (order === 'newest' || order === 'oldest') {
                    const dateA = a.data.timestamp || 0;
                    const dateB = b.data.timestamp || 0;
                    return order === 'newest' ? dateB - dateA : dateA - dateB;
                } else if (order === 'code-asc' || order === 'code-desc') {
                    const codeA = (a.data.locationCode || '').toLowerCase();
                    const codeB = (b.data.locationCode || '').toLowerCase();
                    return order === 'code-asc' ? codeA.localeCompare(codeB) : codeB.localeCompare(codeA);
                }
            });

            renderLocations();
        }

        // ===================== RENDER LOCATIONS =====================
        function renderLocations() {
            const tbody = document.getElementById('locationTableBody');
            tbody.innerHTML = '';

            if (allLocations.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" style="text-align:center; padding: 3rem; color: #6B7C6B;">
                            <div style="font-size: 3rem; margin-bottom: 1rem;">🌾</div>
                            <div style="font-size: 1.1rem; font-weight: 600; color: #1B5E20;">No locations found</div>
                            <div style="font-size: 0.9rem; margin-top: 0.5rem;">Click "Add Location" to create your first entry</div>
                        </td>
                    </tr>`;
                return;
            }

            allLocations.forEach(item => {
                const data = item.data;
                const docId = item.docId;

                const tr = document.createElement('tr');
                tr.classList.add('data-row');
                tr.dataset.id = docId;
                tr.innerHTML = `
                    <td>${data.locationCode || '-'}</td>
                    <td>${data.provinceName || '-'}</td>
                    <td>${data.abbreviation || '-'}</td>
                `;

                tbody.appendChild(tr);
            });

            attachRowClickListeners();
        }

        // ===================== ROW CLICK → FLOATING BUTTONS =====================
        function attachRowClickListeners() {
            document.querySelectorAll('.data-row').forEach(row => {
                row.addEventListener('click', (e) => {
                    const rowId = row.dataset.id;

                    const existingButtons = document.querySelector('.floating-action-buttons');

                    if (activeRowId === rowId) {
                        // --- Clicking the SAME row → hide buttons (toggle off) ---
                        if (existingButtons) existingButtons.remove();
                        row.classList.remove('row-selected');
                        activeRowId = null;
                    } else {
                        // --- Clicking a DIFFERENT row → move buttons there ---

                        // 1. Remove old buttons & highlight
                        if (existingButtons) existingButtons.remove();
                        document.querySelectorAll('.data-row.row-selected').forEach(r => r.classList.remove('row-selected'));

                        // 2. Highlight the new row
                        row.classList.add('row-selected');
                        activeRowId = rowId;

                        // 3. Create floating Edit / Delete buttons
                        const buttonContainer = document.createElement('div');
                        buttonContainer.className = 'floating-action-buttons';
                        buttonContainer.innerHTML = `
                            <button class="action-btn-edit" data-id="${rowId}">
                                <span>✏️</span>
                                <span>Edit Transaction</span>
                            </button>
                            <button class="action-btn-delete" data-id="${rowId}">
                                <span>🗑️</span>
                                <span>Delete Transaction</span>
                            </button>
                        `;

                        // Append to body so position:fixed works reliably
                        document.body.appendChild(buttonContainer);

                        // 4. Wire up Edit
                        buttonContainer.querySelector('.action-btn-edit').addEventListener('click', (e) => {
                            e.stopPropagation();
                            editLocation(rowId);
                        });

                        // 5. Wire up Delete
                        buttonContainer.querySelector('.action-btn-delete').addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (confirm('🗑️ Are you sure you want to delete this location?')) {
                                deleteLocation(rowId);
                            }
                        });
                    }
                });
            });
        }

        // ===================== EDIT LOCATION =====================
        function editLocation(docId) {
            database.ref('locations/' + docId).once('value')
                .then((snapshot) => {
                    if (!snapshot.exists()) {
                        alert('❌ Location not found!');
                        return;
                    }

                    const data = snapshot.val();

                    document.getElementById('locationCode').value  = data.locationCode || '';
                    document.getElementById('provinceName').value  = data.provinceName || '';
                    document.getElementById('abbreviation').value  = data.abbreviation || '';

                    locationForm.setAttribute('data-edit-id', docId);
                    locationModal.classList.add('active');
                })
                .catch((error) => {
                    console.error('Error loading location:', error);
                    alert('❌ Error loading location: ' + error.message);
                });
        }

        // ===================== DELETE LOCATION =====================
        function deleteLocation(docId) {
            database.ref('locations/' + docId).remove()
                .then(() => {
                    alert('✅ Location deleted successfully!');
                    activeRowId = null;
                })
                .catch((error) => {
                    console.error('Error deleting location:', error);
                    alert('❌ Error deleting location: ' + error.message);
                });
        }

        // ===================== LOAD LOCATIONS FROM FIREBASE =====================
        function loadLocations() {
            const tbody = document.getElementById('locationTableBody');
            const locationsRef = database.ref('locations');

            locationsRef.on('value', (snapshot) => {
                allLocations = [];

                if (!snapshot.exists()) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="3" style="text-align:center; padding: 3rem; color: #6B7C6B;">
                                <div style="font-size: 3rem; margin-bottom: 1rem;">🌾</div>
                                <div style="font-size: 1.1rem; font-weight: 600; color: #1B5E20;">No locations found</div>
                                <div style="font-size: 0.9rem; margin-top: 0.5rem;">Click "Add Location" to create your first entry</div>
                            </td>
                        </tr>`;
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    allLocations.push({
                        docId: childSnapshot.key,
                        data: childSnapshot.val()
                    });
                });

                sortLocations(currentSortOrder);
            }, (error) => {
                console.error('Error loading locations:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" style="text-align:center; color: #C62828; padding: 3rem;">
                            <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                            <div style="font-size: 1.1rem; font-weight: 600;">Error loading locations</div>
                            <div style="font-size: 0.9rem; margin-top: 0.5rem;">${error.message}</div>
                        </td>
                    </tr>`;
            });
        }

        // ===================== SORT SELECT HANDLER =====================
        document.getElementById('sortSelect').addEventListener('change', (e) => {
            sortLocations(e.target.value);
        });

        // ===================== PREVIEW BUTTON =====================
        document.getElementById('previewBtn').addEventListener('click', () => {
            window.open('location-preview.html');
        });

        // ===================== INIT =====================
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🌾 Location Library page loaded');
            loadLocations();
        });

        // ===================== HEADER SCROLL EFFECT =====================
        window.addEventListener('scroll', () => {
            const header = document.querySelector('.header');
            if (window.scrollY > 0) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>

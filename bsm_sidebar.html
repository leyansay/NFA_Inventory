<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSM Sidebar</title>
    <style>
        :root {
            --primary-green:       #1B5E20;
            --primary-green-light: #2E7D32;
            --primary-green-dark:  #0D3D11;
            --beige-light:         #F1E9D2;
            --beige-main:          #E8D8B5;
            --beige-dark:          #D4C4A0;
            --gold-main:           #F9A825;
            --gold-light:          #FFB300;
            --white:               #FFFFFF;
            --text-primary:        #1B1B1B;
            --text-secondary:      #555555;
            --error-red:           #D32F2F;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-green-dark);
            color: white;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            background: linear-gradient(180deg, #ffffff 0%, var(--beige-light) 100%);
            padding: 0;
            position: fixed;
            left: 0; top: 0;
            box-shadow: 4px 0 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
        }

        /* ── Logo ── */
        .logo {
            padding: 1.8rem 1.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary-green-light) 0%, var(--primary-green) 100%);
            box-shadow: 0 4px 12px rgba(27,94,32,0.2);
        }
        .logo-container { display: flex; align-items: center; gap: 0.8rem; }
        .logo-image {
            width: 45px; height: 45px;
            object-fit: contain;
            background: var(--beige-light);
            border-radius: 8px;
            padding: 5px;
        }
        .logo h1 { font-size: 1.5rem; color: #fff; font-weight: 700; }
        .logo p  { font-size: 0.75rem; color: rgba(255,255,255,0.95); margin-top: 0.25rem; }

        /* ── Menu ── */
        .menu {
            list-style: none;
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 0;
        }
        .menu-item {
            padding: 1rem 1.5rem;
            margin: 0.25rem 0.75rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--text-primary);
            font-size: 1rem;
            text-decoration: none;
            border-radius: 10px;
            border-left: 3px solid transparent;
            position: relative;
        }
        .menu-item:hover {
            background: linear-gradient(90deg, rgba(27,94,32,0.1) 0%, rgba(27,94,32,0.05) 100%);
            border-left: 3px solid var(--primary-green);
            color: var(--primary-green);
            transform: translateX(2px);
        }
        .menu-item.active {
            background: linear-gradient(90deg, rgba(249,168,37,0.15) 0%, rgba(249,168,37,0.08) 100%);
            border-left: 3px solid var(--gold-main);
            color: var(--primary-green);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(249,168,37,0.2);
        }
        .menu-item.active::after {
            content: '';
            position: absolute;
            right: 1rem;
            width: 8px; height: 8px;
            background: var(--gold-main);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(249,168,37,0.6);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.6; transform: scale(1.2); }
        }
        .menu-icon { font-size: 1.4rem; width: 28px; text-align: center; }

        .menu::-webkit-scrollbar { width: 6px; }
        .menu::-webkit-scrollbar-track { background: transparent; }
        .menu::-webkit-scrollbar-thumb { background: rgba(27,94,32,0.3); border-radius: 3px; }
        .menu::-webkit-scrollbar-thumb:hover { background: rgba(27,94,32,0.5); }

        /* ── Settings Section (replaces logout) ── */
        .settings-section {
            padding: 1rem 1.5rem;
            border-top: 2px solid var(--beige-main);
            background: linear-gradient(180deg, var(--beige-light) 0%, #ffffff 100%);
            position: relative;
        }

        /* Slide-up dropdown panel */
        .settings-dropdown {
            position: absolute;
            bottom: calc(100% - 0.4rem);
            left: 0.75rem;
            right: 0.75rem;
            background: white;
            border: 1px solid var(--beige-main);
            border-radius: 14px;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transform: translateY(8px);
            transition: max-height 0.35s ease, opacity 0.3s ease, transform 0.3s ease;
            box-shadow: 0 -6px 24px rgba(27,94,32,0.12);
            z-index: 100;
        }
        .settings-dropdown.open {
            max-height: 160px;
            opacity: 1;
            transform: translateY(0);
        }
        .settings-dropdown-inner { padding: 0.5rem; }

        .settings-dropdown-item {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-primary);
            font-size: 0.93rem;
            font-weight: 500;
            border-left: 3px solid transparent;
        }
        .settings-dropdown-item:hover {
            background: rgba(27,94,32,0.07);
            color: var(--primary-green);
            border-left-color: var(--primary-green);
            transform: translateX(2px);
        }
        .settings-dropdown-item.logout-item:hover {
            background: rgba(211,47,47,0.08);
            color: var(--error-red);
            border-left-color: var(--error-red);
        }
        .settings-dropdown-divider {
            height: 1px;
            background: var(--beige-main);
            margin: 0.3rem 0.5rem;
        }
        .settings-dropdown-item-icon { font-size: 1.1rem; width: 22px; text-align: center; }

        /* Settings trigger button */
        .settings-btn {
            width: 100%;
            padding: 0.85rem 1rem;
            background: linear-gradient(135deg, var(--primary-green-light) 0%, var(--primary-green) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(27,94,32,0.2);
        }
        .settings-btn:hover {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-green-dark) 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(27,94,32,0.3);
        }
        .settings-btn.open {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-green-dark) 100%);
        }
        .settings-btn-left { display: flex; align-items: center; gap: 0.8rem; }
        .settings-icon {
            font-size: 1.1rem;
            transition: transform 0.5s ease;
        }
        .settings-btn.open .settings-icon { transform: rotate(90deg); }
        .settings-arrow {
            font-size: 0.75rem;
            opacity: 0.8;
            transition: transform 0.3s ease;
        }
        .settings-btn.open .settings-arrow { transform: rotate(180deg); }

        /* ── Logout Modal ── */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 90%;
            animation: slideUp 0.3s ease;
            text-align: center;
            border-top: 5px solid var(--primary-green);
        }
        .modal-header {
            display: flex; flex-direction: column;
            align-items: center; gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .modal-icon { font-size: 3.5rem; }
        .modal-title { font-size: 1.6rem; font-weight: 700; color: var(--primary-green); margin: 0; }
        .modal-message { color: var(--text-secondary); font-size: 1.05rem; line-height: 1.6; margin-bottom: 2rem; }
        .modal-buttons { display: flex; gap: 1rem; justify-content: center; }
        .modal-btn {
            padding: 0.85rem 2rem; border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; min-width: 130px;
        }
        .modal-btn-cancel { background: var(--beige-main); color: var(--text-primary); }
        .modal-btn-cancel:hover { background: var(--beige-dark); }
        .modal-btn-confirm {
            background: linear-gradient(135deg, var(--error-red) 0%, #c62828 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(211,47,47,0.3);
        }
        .modal-btn-confirm:hover {
            background: linear-gradient(135deg, #c62828 0%, #b71c1c 100%);
            transform: translateY(-2px);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo">
            <div class="logo-container">
                <img src="images/nfa.png" alt="NFA Logo" class="logo-image">
                <div>
                    <h1>NFA BSM</h1>
                    <p>Reports System</p>
                </div>
            </div>
        </div>

        <ul class="menu">
            <li class="menu-item" data-page="transaction-reports">
                <span>Home</span>
            </li>
            <li class="menu-item" data-page="all-transactions">
                <span>All Transactions</span>
            </li>
            <li class="menu-item" data-page="today-transactions">
                <span>Today's Transactions</span>
            </li>
            <li class="menu-item" data-page="month-transactions">
                <span>This Month</span>
            </li>
            <li class="menu-item" data-page="year-transactions">
                <span>This Year</span>
            </li>
        </ul>

        <!-- Settings Section -->
        <div class="settings-section" id="settingsSection">

            <!-- Slide-up panel -->
            <div class="settings-dropdown" id="settingsDropdown">
                <div class="settings-dropdown-inner">
                    <div class="settings-dropdown-item" onclick="goToProfile()">
                        <span>Profile</span>
                    </div>
                    <div class="settings-dropdown-divider"></div>
                    <div class="settings-dropdown-item logout-item" onclick="handleLogout()">
                        <span>Logout</span>
                    </div>
                </div>
            </div>

            <!-- Trigger button -->
            <button class="settings-btn" id="settingsBtn" onclick="toggleSettings()">
                <span class="settings-btn-left">
                    <span class="settings-icon">⚙️</span>
                    <span>Settings</span>
                </span>
                <span class="settings-arrow">▼</span>
            </button>
        </div>
    </nav>

    <!-- Logout Modal -->
    <div class="modal-overlay" id="logoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-icon">⚠️</span>
                <h2 class="modal-title">Confirm Logout</h2>
            </div>
            <p class="modal-message">Are you sure you want to logout from BSM Reports System?</p>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="closeLogoutModal()">Cancel</button>
                <button class="modal-btn modal-btn-confirm" onclick="confirmLogout()">Yes, Logout</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey:            "AIzaSyB_hLdWDYdBsZFmhTFpg4QIzdOiB9JxxIw",
            authDomain:        "nfa-main.firebaseapp.com",
            databaseURL:       "https://nfa-main-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId:         "nfa-main",
            storageBucket:     "nfa-main.firebasestorage.app",
            messagingSenderId: "314192469082",
            appId:             "1:314892469082:web:2f301895179a22dbe68c63",
            measurementId:     "G-ZEJP0S67SY"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        const pageLinks = {
            'transaction-reports': 'bsm_home.html',
            'all-transactions':    'bsm_all.html',
            'today-transactions':  'bsm_today.html',
            'month-transactions':  'bsm_month.html',
            'year-transactions':   'bsm_year.html'
        };

        /* ── Settings Dropdown ── */
        function toggleSettings() {
            var btn    = document.getElementById('settingsBtn');
            var panel  = document.getElementById('settingsDropdown');
            btn.classList.toggle('open');
            panel.classList.toggle('open');
        }

        function closeSettings() {
            document.getElementById('settingsBtn').classList.remove('open');
            document.getElementById('settingsDropdown').classList.remove('open');
        }

        // Close if clicking outside the settings section
        document.addEventListener('click', function(e) {
            var section = document.getElementById('settingsSection');
            if (!section.contains(e.target)) closeSettings();
        });

        /* ── Profile Navigation ── */
        function goToProfile() {
            closeSettings();
            var target = window.parent !== window ? window.parent : window;
            target.location.href = 'bsm_profile.html';
        }

        /* ── Logout ── */
        function handleLogout() {
            closeSettings();
            var modal = document.getElementById('logoutModal');

            if (window.parent !== window && window.parent.document.body) {
                var parentModal = modal.cloneNode(true);
                parentModal.id = 'logoutModalParent';
                window.parent.document.body.appendChild(parentModal);

                if (!window.parent.document.getElementById('logoutModalStyles')) {
                    var styleEl = document.createElement('style');
                    styleEl.id = 'logoutModalStyles';
                    styleEl.textContent = document.querySelector('style').textContent;
                    window.parent.document.head.appendChild(styleEl);
                }

                parentModal.classList.add('active');

                parentModal.querySelector('.modal-btn-cancel').onclick = function() {
                    parentModal.classList.remove('active');
                    setTimeout(function() { parentModal.remove(); }, 300);
                };
                parentModal.querySelector('.modal-btn-confirm').onclick = function() {
                    confirmLogout();
                    parentModal.classList.remove('active');
                    setTimeout(function() { parentModal.remove(); }, 300);
                };
                parentModal.onclick = function(e) {
                    if (e.target === parentModal) {
                        parentModal.classList.remove('active');
                        setTimeout(function() { parentModal.remove(); }, 300);
                    }
                };
            } else {
                modal.classList.add('active');
            }
        }

        function closeLogoutModal() {
            document.getElementById('logoutModal').classList.remove('active');
            var p = window.parent.document.getElementById('logoutModalParent');
            if (p) { p.classList.remove('active'); setTimeout(function(){ p.remove(); }, 300); }
        }

        function confirmLogout() {
            closeLogoutModal();
            sessionStorage.clear();
            localStorage.clear();

            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;';
            var msg = document.createElement('div');
            msg.style.cssText = 'background:linear-gradient(135deg,#1B5E20,#2E7D32);color:white;padding:2.5rem 4rem;border-radius:20px;font-size:1.4rem;font-weight:600;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);';
            msg.innerHTML = '🌾 Logging out...<br><small style="font-size:0.9rem;font-weight:normal;opacity:0.9;margin-top:0.5rem;display:block;">Redirecting to login page</small>';
            overlay.appendChild(msg);
            (window.parent !== window ? window.parent.document.body : document.body).appendChild(overlay);

            setTimeout(function() { window.parent.location.href = 'index.html'; }, 1500);
        }

        /* ── Active Menu ── */
        function setActiveMenuItem() {
            var currentPage = window.parent.location.pathname.split('/').pop();
            var pageToMenuItem = {
                'bsm_home.html':  'transaction-reports',
                'bsm_all.html':   'all-transactions',
                'bsm_today.html': 'today-transactions',
                'bsm_month.html': 'month-transactions',
                'bsm_year.html':  'year-transactions'
            };
            var active = pageToMenuItem[currentPage];
            document.querySelectorAll('.menu-item').forEach(function(item) {
                item.classList.remove('active');
            });
            if (active) {
                var el = document.querySelector('[data-page="' + active + '"]');
                if (el) el.classList.add('active');
            }
        }

        /* ── Transaction Stats ── */
        function loadTransactionStats() {
            database.ref('reports').on('value', function(snapshot) {
                var todayCount = 0, monthCount = 0, yearCount = 0;
                var now = new Date();
                var today = now.toISOString().split('T')[0];
                var currentMonth = now.getMonth();
                var currentYear  = now.getFullYear();

                if (snapshot.exists()) {
                    snapshot.forEach(function(child) {
                        var report = child.val();
                        if (report.transactions && Array.isArray(report.transactions)) {
                            report.transactions.forEach(function(tx) {
                                if (tx.transactionDate) {
                                    if (tx.transactionDate === today) todayCount++;
                                    var d = new Date(tx.transactionDate);
                                    if (d.getMonth() === currentMonth && d.getFullYear() === currentYear) monthCount++;
                                    if (d.getFullYear() === currentYear) yearCount++;
                                }
                            });
                        }
                    });
                }

                var todayEl = document.getElementById('todayTransactions');
                var monthEl = document.getElementById('monthTransactions');
                var yearEl  = document.getElementById('yearTransactions');
                if (todayEl) todayEl.textContent = todayCount.toLocaleString();
                if (monthEl) monthEl.textContent = monthCount.toLocaleString();
                if (yearEl)  yearEl.textContent  = yearCount.toLocaleString();
                document.querySelectorAll('.info-card').forEach(function(c) { c.classList.remove('loading'); });

            }, function(err) {
                console.error('Error loading stats:', err);
            });
        }

        /* ── Menu click ── */
        document.querySelectorAll('.menu-item').forEach(function(item) {
            item.addEventListener('click', function() {
                var page = this.getAttribute('data-page');
                var link = pageLinks[page];
                document.querySelectorAll('.menu-item').forEach(function(i) { i.classList.remove('active'); });
                this.classList.add('active');
                if (link) window.parent.location.href = link;
            });
        });

        /* ── Init ── */
        window.addEventListener('DOMContentLoaded', function() {
            setActiveMenuItem();
            loadTransactionStats();
        });

        if (window.parent !== window) {
            setInterval(setActiveMenuItem, 500);
        }
    </script>
</body>
</html>

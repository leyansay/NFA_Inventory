<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSM Sidebar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1d2e;
            color: white;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            background: linear-gradient(180deg, #ffffff 0%, #f8f9fa 100%);
            padding: 0;
            position: fixed;
            left: 0;
            top: 0;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
        }

        .logo {
            padding: 1.8rem 1.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .logo-image {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .logo h1 {
            font-size: 1.5rem;
            color: #ffffff;
            font-weight: 700;
        }

        .logo p {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 0.25rem;
        }

        .role-badge {
            background: rgba(139, 92, 246, 0.1);
            padding: 0.75rem 1.5rem;
            margin: 0 1.5rem 1.5rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(139, 92, 246, 0.2);
        }

        .role-badge-title {
            font-size: 0.7rem;
            color: #6b7299;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.25rem;
        }

        .role-badge-name {
            font-size: 0.95rem;
            color: #8b5cf6;
            font-weight: 700;
        }

        .menu {
            list-style: none;
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 0;
        }

        .menu-section-title {
            padding: 1rem 1.5rem 0.75rem;
            color: #8b5cf6;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .menu-item {
            padding: 1rem 1.5rem;
            margin: 0.25rem 0.75rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #2c3e50;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 10px;
            border-left: 3px solid transparent;
            position: relative;
        }

        .menu-item:hover {
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.1) 0%, rgba(139, 92, 246, 0.05) 100%);
            border-left: 3px solid #8b5cf6;
            color: #8b5cf6;
            transform: translateX(2px);
        }

        .menu-item.active {
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.15) 0%, rgba(139, 92, 246, 0.08) 100%);
            border-left: 3px solid #8b5cf6;
            color: #8b5cf6;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.15);
        }

        .menu-item.active::after {
            content: '';
            position: absolute;
            right: 1rem;
            width: 8px;
            height: 8px;
            background: #8b5cf6;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.2);
            }
        }

        .menu-icon {
            font-size: 1.4rem;
            width: 28px;
            text-align: center;
        }

        .info-section {
            padding: 1rem 1.5rem;
            background: #f8f9fa;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }

        .info-card {
            background: white;
            padding: 0.9rem;
            border-radius: 8px;
            margin-bottom: 0.8rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .info-label {
            font-size: 0.65rem;
            color: #6b7299;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.4rem;
        }

        .info-value {
            font-size: 1.3rem;
            color: #8b5cf6;
            font-weight: 700;
        }

        .info-card.loading .info-value {
            color: #a78bfa;
            font-size: 0.9rem;
        }

        .logout-section {
            padding: 1rem 1.5rem;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            background: linear-gradient(180deg, #f8f9fa 0%, #ffffff 100%);
        }

        .logout-btn {
            width: 100%;
            padding: 0.85rem 1rem;
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.2);
        }

        .logout-btn:hover {
            background: linear-gradient(135deg, #c82333 0%, #bd2130 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(220, 53, 69, 0.3);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 90%;
            animation: slideUp 0.3s ease;
            text-align: center;
        }

        .modal-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .modal-icon {
            font-size: 3.5rem;
        }

        .modal-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #2c3e50;
            margin: 0;
        }

        .modal-message {
            color: #5a6c7d;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .modal-btn {
            padding: 0.85rem 2rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 130px;
        }

        .modal-btn-cancel {
            background: #e9ecef;
            color: #495057;
        }

        .modal-btn-cancel:hover {
            background: #dee2e6;
        }

        .modal-btn-confirm {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
        }

        .modal-btn-confirm:hover {
            background: linear-gradient(135deg, #c82333 0%, #bd2130 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(220, 53, 69, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .menu::-webkit-scrollbar {
            width: 6px;
        }

        .menu::-webkit-scrollbar-track {
            background: transparent;
        }

        .menu::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 3px;
        }

        .menu::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.5);
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="logo">
            <div class="logo-container">
                <img src="images/nfa.png" 
                     alt="NFA Logo" 
                     class="logo-image">
                <div>
                    <h1>NFA BSM</h1>
                    <p>Reports System</p>
                </div>
            </div>
        </div>

        <div class="role-badge">
            <div class="role-badge-title">Access Level</div>
            <div class="role-badge-name">Branch Supply Manager</div>
        </div>

        <ul class="menu">
            <li class="menu-section-title">
                <span>📊</span> MENU
            </li>
            
            <li class="menu-item" data-page="transaction-reports">
                <span class="menu-icon">🏠</span>
                <span>Home</span>
            </li>

            <li class="menu-item" data-page="all-transactions">
                <span class="menu-icon">🗓️</span>
                <span>All Transactions</span>
            </li>
            
            <li class="menu-item" data-page="today-transactions">
                <span class="menu-icon">🗓️</span>
                <span>Today's Transactions</span>
            </li>
            
            <li class="menu-item" data-page="month-transactions">
                <span class="menu-icon">🗓️</span>
                <span>This Month</span>
            </li>
            
            <li class="menu-item" data-page="year-transactions">
                <span class="menu-icon">🗓️</span>
                <span>This Year</span>
            </li>
        </ul>

        <div class="logout-section">
            <button class="logout-btn" onclick="handleLogout()">
                <span>Logout</span>
            </button>
        </div>
    </nav>

    <div class="modal-overlay" id="logoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-icon">⚠️</span>
                <h2 class="modal-title">Confirm Logout</h2>
            </div>
            <p class="modal-message">
                Are you sure you want to logout from BSM Reports System?
            </p>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="closeLogoutModal()">Cancel</button>
                <button class="modal-btn modal-btn-confirm" onclick="confirmLogout()">Yes, Logout</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB_hLdWDYdBsZFmhTFpg4QIzdOiB9JxxIw",
            authDomain: "nfa-main.firebaseapp.com",
            databaseURL: "https://nfa-main-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nfa-main",
            storageBucket: "nfa-main.firebasestorage.app",
            messagingSenderId: "314192469082",
            appId: "1:314892469082:web:2f301895179a22dbe68c63",
            measurementId: "G-ZEJP0S67SY"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        const pageLinks = {
            'transaction-reports': 'bsm_home.html',
            'all-transactions' : 'bsm_all.html',
            'today-transactions': 'bsm_today.html',
            'month-transactions': 'bsm_month.html',
            'year-transactions': 'bsm_year.html'
        };

        // Function to set active menu item based on current page
        function setActiveMenuItem() {
            const currentPage = window.parent.location.pathname.split('/').pop();
            
            // Map current page to menu item
            const pageToMenuItem = {
                'bsm_home.html': 'transaction-reports',
                'bsm_all.html' : 'all-transactions',
                'bsm_today.html': 'today-transactions',
                'bsm_month.html': 'month-transactions',
                'bsm_year.html': 'year-transactions'
            };

            const activeMenuPage = pageToMenuItem[currentPage];
            
            // Remove active class from all items
            document.querySelectorAll('.menu-item').forEach(item => {
                item.classList.remove('active');
            });

            // Add active class to current page
            if (activeMenuPage) {
                const activeItem = document.querySelector(`[data-page="${activeMenuPage}"]`);
                if (activeItem) {
                    activeItem.classList.add('active');
                }
            }
        }

        // Load transaction statistics
        function loadTransactionStats() {
            database.ref('reports').on('value', (snapshot) => {
                let todayCount = 0;
                let monthCount = 0;
                let yearCount = 0;

                const now = new Date();
                const today = now.toISOString().split('T')[0]; // YYYY-MM-DD
                const currentMonth = now.getMonth(); // 0-11
                const currentYear = now.getFullYear();

                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const report = child.val();
                        
                        if (report.transactions && Array.isArray(report.transactions)) {
                            report.transactions.forEach(transaction => {
                                const transactionDate = transaction.transactionDate;
                                
                                if (transactionDate) {
                                    // Check if today
                                    if (transactionDate === today) {
                                        todayCount++;
                                    }
                                    
                                    // Check if this month
                                    const txDate = new Date(transactionDate);
                                    if (txDate.getMonth() === currentMonth && txDate.getFullYear() === currentYear) {
                                        monthCount++;
                                    }
                                    
                                    // Check if this year
                                    if (txDate.getFullYear() === currentYear) {
                                        yearCount++;
                                    }
                                }
                            });
                        }
                    });
                }

                // Update UI
                const todayEl = document.getElementById('todayTransactions');
                const monthEl = document.getElementById('monthTransactions');
                const yearEl = document.getElementById('yearTransactions');

                if (todayEl) todayEl.textContent = todayCount.toLocaleString();
                if (monthEl) monthEl.textContent = monthCount.toLocaleString();
                if (yearEl) yearEl.textContent = yearCount.toLocaleString();

                // Remove loading class
                document.querySelectorAll('.info-card').forEach(card => {
                    card.classList.remove('loading');
                });
            }, (error) => {
                console.error('Error loading transaction stats:', error);
                const todayEl = document.getElementById('todayTransactions');
                const monthEl = document.getElementById('monthTransactions');
                const yearEl = document.getElementById('yearTransactions');
                
                if (todayEl) todayEl.textContent = 'Error';
                if (monthEl) monthEl.textContent = 'Error';
                if (yearEl) yearEl.textContent = 'Error';
            });
        }

        function handleLogout() {
            const modal = document.getElementById('logoutModal');
            
            if (window.parent !== window && window.parent.document.body) {
                const parentModal = modal.cloneNode(true);
                parentModal.id = 'logoutModalParent';
                window.parent.document.body.appendChild(parentModal);
                
                if (!window.parent.document.getElementById('logoutModalStyles')) {
                    const styleElement = document.createElement('style');
                    styleElement.id = 'logoutModalStyles';
                    styleElement.textContent = document.querySelector('style').textContent;
                    window.parent.document.head.appendChild(styleElement);
                }
                
                parentModal.classList.add('active');
                
                const cancelBtn = parentModal.querySelector('.modal-btn-cancel');
                const confirmBtn = parentModal.querySelector('.modal-btn-confirm');
                
                cancelBtn.onclick = function() {
                    parentModal.classList.remove('active');
                    setTimeout(() => parentModal.remove(), 300);
                };
                
                confirmBtn.onclick = function() {
                    confirmLogout();
                    parentModal.classList.remove('active');
                    setTimeout(() => parentModal.remove(), 300);
                };
                
                parentModal.onclick = function(event) {
                    if (event.target === parentModal) {
                        parentModal.classList.remove('active');
                        setTimeout(() => parentModal.remove(), 300);
                    }
                };
            } else {
                modal.classList.add('active');
            }
        }

        function closeLogoutModal() {
            const modal = document.getElementById('logoutModal');
            modal.classList.remove('active');
            
            const parentModal = window.parent.document.getElementById('logoutModalParent');
            if (parentModal) {
                parentModal.classList.remove('active');
                setTimeout(() => parentModal.remove(), 300);
            }
        }

        function confirmLogout() {
            closeLogoutModal();
            
            sessionStorage.clear();
            localStorage.clear();
            
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.6);
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
            `;
            
            const logoutMessage = document.createElement('div');
            logoutMessage.style.cssText = `
                background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
                color: white;
                padding: 2.5rem 4rem;
                border-radius: 20px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
                font-size: 1.4rem;
                font-weight: 600;
                text-align: center;
            `;
            logoutMessage.innerHTML = 'Logging out...<br><small style="font-size: 0.9rem; font-weight: normal; opacity: 0.9; margin-top: 0.5rem; display: block;">Redirecting to login page</small>';
            
            overlay.appendChild(logoutMessage);
            
            if (window.parent !== window) {
                window.parent.document.body.appendChild(overlay);
            } else {
                document.body.appendChild(overlay);
            }
            
            setTimeout(function() {
                window.parent.location.href = 'index.html';
            }, 1500);
        }

        // Handle menu item clicks
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', function() {
                const page = this.getAttribute('data-page');
                const link = pageLinks[page];
                
                // Remove active class from all items
                document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                
                // Add active class to clicked item
                this.classList.add('active');
                
                // Navigate to page
                if (link) {
                    window.parent.location.href = link;
                }
            });
        });

        // Load stats and set active menu when page loads
        window.addEventListener('DOMContentLoaded', function() {
            setActiveMenuItem();
            loadTransactionStats();
        });

        // Update active menu item when parent page changes
        if (window.parent !== window) {
            setInterval(setActiveMenuItem, 500);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cereal Library - NFA Inventory System</title>
    <link rel="stylesheet" href="css/cereal.css" />
</head>
<body>
    <iframe src="sidebar.html" style="width: 250px; height: 100vh; border: none; position: fixed; left: 0; top: 0;"></iframe>

    <div class="main-content">
        <div class="header">
            <div class="header-left">
                <h1>Cereal Library</h1>
                <p style="color: #6B7C6B; font-size: 0.9rem; margin-top: 0.25rem;">Manage and organize cereal records</p>
            </div>
            <div class="header-right">
                <div class="user-info">
                    <div class="user-greeting">Hi, nfa_admin</div>
                    <div class="user-role">Administrator</div>
                </div>
                <div class="user-avatar">N</div>
            </div>
        </div>

        <div class="controls">
            <div class="sort-section">
                <label>📊 Sort by:</label>
                <select class="sort-select" id="sortSelect">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="code-asc">Code (A-Z)</option>
                    <option value="code-desc">Code (Z-A)</option>
                </select>
            </div>
            <div class="button-group">
                <button class="btn btn-preview" id="previewBtn">
                    <span>👁️</span>
                    <span>Preview</span>
                </button>
                <button class="btn btn-add" id="addCerealBtn">
                    <span>➕</span>
                    <span>Add Cereal</span>
                </button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>🔖 CEREAL CODE</th>
                        <th>📝 DESCRIPTION</th>
                        <th>📊 COMPUTE TA FOR</th>
                    </tr>
                </thead>
                <tbody id="cerealTableBody">
                    <tr>
                        <td colspan="3" style="text-align:center; padding: 3rem; color: #6B7C6B;">
                            <div style="font-size: 3rem; margin-bottom: 1rem;">🌾</div>
                            <div style="font-size: 1.1rem; font-weight: 600; color: #1B5E20;">Loading cereals...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="cerealModal">
        <div class="modal-container">
            <div class="modal-header">
                <h2 class="modal-title">📋 DATA ENTRY OF CEREAL LIBRARY</h2>
                <button class="close-btn" id="closeModalBtn">×</button>
            </div>

            <div class="modal-body">
                <form id="cerealForm">
                    <!-- Cereal Code -->
                    <div class="form-group">
                        <label class="form-label">🔖 Cereal Code: <span style="color: #C62828;">*</span></label>
                        <input type="text" class="form-input" id="cerealCode" placeholder="Enter Cereal Code" required>
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label class="form-label">📝 Description: <span style="color: #C62828;">*</span></label>
                        <input type="text" class="form-input" id="description" placeholder="Enter Description" required>
                    </div>

                    <!-- Compute TA for -->
                    <div class="form-group">
                        <label class="form-label">📊 Compute TA for: <span style="color: #C62828;">*</span></label>
                        <select class="form-select" id="computeTAFor" required>
                            <option value="">-- Select Option --</option>
                            <option value="TOTAL WEIGHT LOSS">Total Weight Loss</option>
                            <option value="MC">MC</option>
                            <option value="Shrinkage Estimation Protocol">Shrinkage Estimation Protocol</option>
                            <option value="Insect Infestation">Insect Infestation</option>
                            <option value="Bird Infestation">Bird Infestation</option>
                            <option value="Rodent Infestation">Rodent Infestation</option>
                        </select>
                    </div>

                    <!-- Save Button -->
                    <button type="submit" class="btn-save">💾 Save Cereal</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script>
        // ===================== FIREBASE CONFIGURATION =====================
        const firebaseConfig = {
            apiKey: "AIzaSyB_hLdWDYdBsZFmhTFpg4QIzdOiB9JxxIw",
            authDomain: "nfa-main.firebaseapp.com",
            databaseURL: "https://nfa-main-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nfa-main",
            storageBucket: "nfa-main.firebasestorage.app",
            messagingSenderId: "314192469082",
            appId: "1:314192469082:web:2f301895179a22dbe68c63",
            measurementId: "G-ZEJP0S67SY"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        console.log("Firebase initialized:", firebase.apps.length > 0);

        // ===================== GLOBAL VARIABLES =====================
        let allCereals = [];
        let currentSortOrder = 'newest';
        let activeRowId = null;

        // ===================== MODAL CONTROLS =====================
        const cerealModal = document.getElementById('cerealModal');
        const addCerealBtn = document.getElementById('addCerealBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cerealForm = document.getElementById('cerealForm');

        // Open modal
        addCerealBtn.addEventListener('click', () => {
            cerealForm.reset();
            cerealForm.removeAttribute('data-edit-id');
            cerealModal.classList.add('active');
        });

        // Close modal
        closeModalBtn.addEventListener('click', () => {
            cerealModal.classList.remove('active');
        });

        // Close modal when clicking outside
        cerealModal.addEventListener('click', (e) => {
            if (e.target === cerealModal) {
                cerealModal.classList.remove('active');
            }
        });

        // Close modal with ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                cerealModal.classList.remove('active');
            }
        });

        // ===================== FORM SUBMIT (SAVE / UPDATE) =====================
        cerealForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const form = e.target;
            const editId = form.getAttribute('data-edit-id');
            
            const cerealData = {
                cerealCode: document.getElementById('cerealCode').value.trim() || "",
                description: document.getElementById('description').value.trim() || "",
                computeTAFor: document.getElementById('computeTAFor').value || "",
                timestamp: Date.now()
            };

            // Clear previous errors
            document.querySelectorAll('input, select').forEach(field => {
                field.style.border = '';
            });
            document.querySelectorAll('.field-error-message').forEach(msg => msg.remove());
            
            // Validate required fields
            let hasEmptyFields = false;
            const requiredFields = [
                { id: 'cerealCode',    value: cerealData.cerealCode },
                { id: 'description',   value: cerealData.description },
                { id: 'computeTAFor',  value: cerealData.computeTAFor }
            ];
            
            requiredFields.forEach(field => {
                if (!field.value) {
                    const element = document.getElementById(field.id);
                    element.style.border = '2px solid #C62828';
                    hasEmptyFields = true;
                    
                    const errorMsg = document.createElement('div');
                    errorMsg.className = 'field-error-message';
                    errorMsg.textContent = '⚠️ This field is required';
                    element.parentElement.appendChild(errorMsg);
                }
            });
            
            if (hasEmptyFields) {
                const firstEmptyField = document.querySelector('[style*="border: 2px solid"]');
                if (firstEmptyField) {
                    firstEmptyField.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    firstEmptyField.focus();
                }
                return;
            }
            
            if (editId) {
                // Update existing cereal
                cerealData.updatedAt = new Date().toISOString();
                database.ref('cereals/' + editId).update(cerealData)
                    .then(() => {
                        alert('✅ Cereal updated successfully!');
                        cerealModal.classList.remove('active');
                        form.reset();
                        form.removeAttribute('data-edit-id');
                        activeRowId = null;
                    })
                    .catch((error) => {
                        console.error('Error updating cereal:', error);
                        alert('❌ Error updating cereal: ' + error.message);
                    });
            } else {
                // Create new cereal
                cerealData.createdAt = new Date().toISOString();
                database.ref('cereals').push(cerealData)
                    .then(() => {
                        alert('✅ Cereal saved successfully!');
                        cerealModal.classList.remove('active');
                        form.reset();
                    })
                    .catch((error) => {
                        console.error('Error saving cereal:', error);
                        alert('❌ Error saving cereal: ' + error.message);
                    });
            }
        });

        // ===================== SORT CEREALS =====================
        function sortCereals(order) {
            currentSortOrder = order;
            
            allCereals.sort((a, b) => {
                if (order === 'newest' || order === 'oldest') {
                    const dateA = a.data.timestamp || 0;
                    const dateB = b.data.timestamp || 0;
                    return order === 'newest' ? dateB - dateA : dateA - dateB;
                } else if (order === 'code-asc' || order === 'code-desc') {
                    const codeA = (a.data.cerealCode || '').toLowerCase();
                    const codeB = (b.data.cerealCode || '').toLowerCase();
                    return order === 'code-asc' ? codeA.localeCompare(codeB) : codeB.localeCompare(codeA);
                }
            });
            
            renderCereals();
        }

        // ===================== RENDER CEREALS =====================
        function renderCereals() {
            const tbody = document.getElementById('cerealTableBody');
            tbody.innerHTML = '';
            
            if (allCereals.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" style="text-align:center; padding: 3rem; color: #6B7C6B;">
                            <div style="font-size: 3rem; margin-bottom: 1rem;">🌾</div>
                            <div style="font-size: 1.1rem; font-weight: 600; color: #1B5E20;">No cereals found</div>
                            <div style="font-size: 0.9rem; margin-top: 0.5rem;">Click "Add Cereal" to create your first entry</div>
                        </td>
                    </tr>`;
                return;
            }
            
            allCereals.forEach(item => {
                const data = item.data;
                const docId = item.docId;
                
                const tr = document.createElement('tr');
                tr.classList.add('data-row');
                tr.dataset.id = docId;
                tr.innerHTML = `
                    <td>${data.cerealCode || '-'}</td>
                    <td>${data.description || '-'}</td>
                    <td>${data.computeTAFor || '-'}</td>
                `;
                
                tbody.appendChild(tr);
            });
            
            attachRowClickListeners();
        }

        // ===================== ROW CLICK → FLOATING BUTTONS =====================
        function attachRowClickListeners() {
            document.querySelectorAll('.data-row').forEach(row => {
                row.addEventListener('click', (e) => {
                    const rowId = row.dataset.id;

                    const existingButtons = document.querySelector('.floating-action-buttons');

                    if (activeRowId === rowId) {
                        // --- Clicking the SAME row → hide buttons (toggle off) ---
                        if (existingButtons) existingButtons.remove();
                        row.classList.remove('row-selected');
                        activeRowId = null;
                    } else {
                        // --- Clicking a DIFFERENT row → move buttons there ---

                        // 1. Remove old buttons & highlight
                        if (existingButtons) existingButtons.remove();
                        document.querySelectorAll('.data-row.row-selected').forEach(r => r.classList.remove('row-selected'));

                        // 2. Highlight the new row
                        row.classList.add('row-selected');
                        activeRowId = rowId;

                        // 3. Create floating Edit / Delete buttons
                        const buttonContainer = document.createElement('div');
                        buttonContainer.className = 'floating-action-buttons';
                        buttonContainer.innerHTML = `
                            <button class="action-btn-edit" data-id="${rowId}">
                                <span>✏️</span>
                                <span>Edit Transaction</span>
                            </button>
                            <button class="action-btn-delete" data-id="${rowId}">
                                <span>🗑️</span>
                                <span>Delete Transaction</span>
                            </button>
                        `;

                        // Append to body so position:fixed works reliably
                        document.body.appendChild(buttonContainer);

                        // 4. Wire up Edit
                        buttonContainer.querySelector('.action-btn-edit').addEventListener('click', (e) => {
                            e.stopPropagation();
                            editCereal(rowId);
                        });

                        // 5. Wire up Delete
                        buttonContainer.querySelector('.action-btn-delete').addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (confirm('🗑️ Are you sure you want to delete this cereal?')) {
                                deleteCereal(rowId);
                            }
                        });
                    }
                });
            });
        }

        // ===================== EDIT CEREAL =====================
        function editCereal(docId) {
            database.ref('cereals/' + docId).once('value')
                .then((snapshot) => {
                    if (!snapshot.exists()) {
                        alert('❌ Cereal not found!');
                        return;
                    }
                    
                    const data = snapshot.val();
                    
                    document.getElementById('cerealCode').value    = data.cerealCode || '';
                    document.getElementById('description').value   = data.description || '';
                    document.getElementById('computeTAFor').value  = data.computeTAFor || '';
                    
                    cerealForm.setAttribute('data-edit-id', docId);
                    cerealModal.classList.add('active');
                })
                .catch((error) => {
                    console.error('Error loading cereal:', error);
                    alert('❌ Error loading cereal: ' + error.message);
                });
        }

        // ===================== DELETE CEREAL =====================
        function deleteCereal(docId) {
            database.ref('cereals/' + docId).remove()
                .then(() => {
                    alert('✅ Cereal deleted successfully!');
                    activeRowId = null;
                })
                .catch((error) => {
                    console.error('Error deleting cereal:', error);
                    alert('❌ Error deleting cereal: ' + error.message);
                });
        }

        // ===================== LOAD CEREALS FROM FIREBASE =====================
        function loadCereals() {
            const tbody = document.getElementById('cerealTableBody');
            const cerealsRef = database.ref('cereals');

            cerealsRef.on('value', (snapshot) => {
                allCereals = [];

                if (!snapshot.exists()) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="3" style="text-align:center; padding: 3rem; color: #6B7C6B;">
                                <div style="font-size: 3rem; margin-bottom: 1rem;">🌾</div>
                                <div style="font-size: 1.1rem; font-weight: 600; color: #1B5E20;">No cereals found</div>
                                <div style="font-size: 0.9rem; margin-top: 0.5rem;">Click "Add Cereal" to create your first entry</div>
                            </td>
                        </tr>`;
                    return;
                }

                snapshot.forEach((childSnapshot) => {
                    allCereals.push({
                        docId: childSnapshot.key,
                        data: childSnapshot.val()
                    });
                });
                
                sortCereals(currentSortOrder);
            }, (error) => {
                console.error('Error loading cereals:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" style="text-align:center; color: #C62828; padding: 3rem;">
                            <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
                            <div style="font-size: 1.1rem; font-weight: 600;">Error loading cereals</div>
                            <div style="font-size: 0.9rem; margin-top: 0.5rem;">${error.message}</div>
                        </td>
                    </tr>`;
            });
        }

        // ===================== SORT SELECT HANDLER =====================
        document.getElementById('sortSelect').addEventListener('change', (e) => {
            sortCereals(e.target.value);
        });

        // ===================== PREVIEW BUTTON =====================
        document.getElementById('previewBtn').addEventListener('click', () => {
            window.open('cereal-preview.html');
        });

        // ===================== INIT =====================
        window.addEventListener('DOMContentLoaded', () => {
            console.log('🌾 Cereal Library page loaded');
            loadCereals();
        });

        // ===================== HEADER SCROLL EFFECT =====================
        window.addEventListener('scroll', () => {
            const header = document.querySelector('.header');
            if (window.scrollY > 0) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>

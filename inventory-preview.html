<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFA Inventory - Print Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background-color: #e8e8e8;
            color: #2c3e50;
        }

        /* ===== PRINT CONTROLS ===== */
        .print-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }

        .btn-print {
            background-color: #2E7D32;
            color: white;
        }

        .btn-print:hover {
            background-color: #1B5E20;
            box-shadow: 0 3px 10px rgba(27, 94, 32, 0.35);
        }

        .btn-close {
            background-color: #5a6a7a;
            color: white;
        }

        .btn-close:hover {
            background-color: #3d4f5f;
        }

        /* ===== PRINT CONTAINER (the "paper") ===== */
        .print-container {
            max-width: 1100px;
            margin: 0 auto;
            background-color: white;
            padding: 50px 55px;
            box-shadow: 0 2px 18px rgba(0, 0, 0, 0.12);
        }

        /* ===== HEADER ===== */
        .print-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 8px;
        }

        .logo {
            width: 64px;
            height: 64px;
            object-fit: contain;
        }

        .header-text {
            text-align: left;
        }

        .header-text h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1B5E20;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header-text .subtitle {
            font-size: 13px;
            color: #5a6a7a;
            margin-top: 3px;
            letter-spacing: 0.4px;
        }

        .header-divider {
            margin: 18px 0 6px 0;
            height: 2px;
            background: linear-gradient(90deg, #1B5E20 0%, #2E7D32 50%, #1B5E20 100%);
        }

        .header-meta {
            text-align: right;
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        /* ===== WAREHOUSE SECTION ===== */
        .warehouse-table {
            margin-bottom: 40px;
            page-break-inside: avoid;
        }

        .warehouse-table:last-child {
            margin-bottom: 0;
        }

        .warehouse-title {
            background-color: #1B5E20;
            color: white;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            border-radius: 4px 4px 0 0;
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #c5c5c5;
            border-top: none;
        }

        thead {
            background-color: #2E7D32;
            color: white;
        }

        th {
            padding: 10px 14px;
            text-align: left;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-right: 1px solid rgba(255,255,255,0.15);
        }

        th:last-child {
            border-right: none;
        }

        tbody tr {
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr:nth-child(even) {
            background-color: #fafafa;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: 9px 14px;
            font-size: 13px;
            color: #2c3e50;
            border-right: 1px solid #ececec;
        }

        td:last-child {
            border-right: none;
        }

        /* ===== SUMMARY ROW ===== */
        .summary-row {
            background-color: #E8F5E9 !important;
            border-top: 2px solid #2E7D32 !important;
        }

        .summary-row td {
            font-weight: 700;
            font-size: 13px;
            color: #1B5E20;
            padding: 11px 14px;
        }

        .no-data {
            text-align: center;
            padding: 28px;
            color: #95a5a6;
            font-style: italic;
            font-size: 13px;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 44px;
            padding-top: 16px;
            border-top: 1px solid #d0d0d0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #7f8c8d;
            font-size: 11px;
            letter-spacing: 0.3px;
        }

        /* ===== PRINT STYLES ===== */
        @media print {
            body {
                background-color: white;
                padding: 0;
            }

            .print-container {
                box-shadow: none;
                padding: 30px 40px;
            }

            .print-controls {
                display: none;
            }

            .warehouse-table {
                page-break-inside: avoid;
            }

            @page {
                margin: 1.5cm;
            }
        }
    </style>
</head>
<body>
    <div class="print-controls">
        <button class="btn btn-print" onclick="window.print()">Print</button>
        <button class="btn btn-close" onclick="window.close()">Close</button>
    </div>

    <div class="print-container">
        <!-- Header -->
        <div class="print-header">
            <img src="images/nfa.png" alt="NFA Logo" class="logo">
            <div class="header-text">
                <h1>NFA Inventory Report</h1>
                <div class="subtitle">National Food Authority — Warehouse Inventory</div>
            </div>
        </div>

        <div class="header-divider"></div>

        <div class="header-meta" id="reportDateTime"></div>

        <!-- Tables -->
        <div id="tablesContainer"></div>

        <!-- Footer -->
        <div class="footer">
            <div>National Food Authority</div>
            <div>Printed: <span id="printDate"></span></div>
        </div>
    </div>

    <script>
        function setDateTime() {
            const now = new Date();
            const opts = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('reportDateTime').textContent = 'Report Generated: ' + now.toLocaleDateString('en-US', opts);

            const shortOpts = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('printDate').textContent = now.toLocaleDateString('en-US', shortOpts);
        }

        function generateTableHTML(title, data, type) {
            // Group data by pile number and variety
            const grouped = {};
            data.forEach(item => {
                const key = item.pileNo + '_' + item.variety;
                if (!grouped[key]) {
                    grouped[key] = {
                        pileNo: item.pileNo,
                        age: item.age,
                        variety: item.variety,
                        totalBags: 0,
                        totalNetWeight: 0
                    };
                }
                grouped[key].totalBags += item.numberOfBags;
                grouped[key].totalNetWeight += item.netWeight;
            });

            const sortedData = Object.values(grouped).sort((a, b) => {
                return (parseInt(a.pileNo) || 0) - (parseInt(b.pileNo) || 0);
            });

            let html = `
                <div class="warehouse-table">
                    <div class="warehouse-title">${title}</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Pile No.</th>
                                <th>Age (Month)</th>
                                <th>Variety</th>
                                <th>No. of Bags</th>
                                <th>Net Kg.</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            if (sortedData.length === 0) {
                html += '<tr><td colspan="5" class="no-data">No data available for this warehouse.</td></tr>';
            } else {
                let totalBags = 0;
                let totalWeight = 0;

                sortedData.forEach(item => {
                    totalBags += item.totalBags;
                    totalWeight += item.totalNetWeight;
                    html += `
                        <tr>
                            <td>${item.pileNo}</td>
                            <td>${item.age}</td>
                            <td>${item.variety}</td>
                            <td>${item.totalBags.toFixed(0)}</td>
                            <td>${item.totalNetWeight.toFixed(2)}</td>
                        </tr>
                    `;
                });

                html += `
                    <tr class="summary-row">
                        <td colspan="3">TOTAL</td>
                        <td>${totalBags.toFixed(0)}</td>
                        <td>${totalWeight.toFixed(2)}</td>
                    </tr>
                `;
            }

            html += '</tbody></table></div>';
            return html;
        }

        function loadTables() {
            const selections = JSON.parse(sessionStorage.getItem('printSelections') || '{}');
            const inventoryData = JSON.parse(sessionStorage.getItem('inventoryData') || '{}');
            const container = document.getElementById('tablesContainer');
            let html = '';

            if (selections.gid1Rice)  html += generateTableHTML('GID 1 — Rice (WD1)',  inventoryData['gid1-rice']  || [], 'rice');
            if (selections.gid2Rice)  html += generateTableHTML('GID 2 — Rice (WD1)',  inventoryData['gid2-rice']  || [], 'rice');
            if (selections.gid1Palay) html += generateTableHTML('GID 1 — Palay (PD)',  inventoryData['gid1-palay'] || [], 'palay');
            if (selections.gid2Palay) html += generateTableHTML('GID 2 — Palay (PD)',  inventoryData['gid2-palay'] || [], 'palay');

            container.innerHTML = html || '<div class="no-data">No tables selected for printing.</div>';
        }

        window.addEventListener('DOMContentLoaded', () => {
            setDateTime();
            loadTables();
        });

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'p') { e.preventDefault(); window.print(); }
            if (e.key === 'Escape') window.close();
        });
    </script>
</body>
</html>
